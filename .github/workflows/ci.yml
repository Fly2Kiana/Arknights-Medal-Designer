name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Smoke test (offline fallback)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python engine/badge_engine.py samples/sword_icon.png -o smoke.png --style arknights
          python engine/badge_engine.py samples/test_subject.png -o smoke2.png --style endfield
      - name: Batch quick test
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python engine/batch_test.py samples --quick
