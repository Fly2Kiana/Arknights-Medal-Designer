<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方舟蚀刻章设计器 · Arknights Medal Designer</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #2d3748;
    --gold: #d4a96e; --cyan: #40ebe0; --text: #e6edf3; --dim: #8b98a9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; height: 100vh; display: flex; overflow: hidden; }
  aside { width: 340px; min-width: 340px; background: var(--panel); border-right: 1px solid var(--line); padding: 18px; overflow-y: auto; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background:
    radial-gradient(1200px 700px at 50% 40%, #131a26 0%, var(--bg) 70%); }
  h1 { font-size: 18px; letter-spacing: 1px; margin-bottom: 4px; color: var(--gold); }
  .sub { font-size: 11px; color: var(--dim); margin-bottom: 16px; line-height: 1.6; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px 12px; text-align: center; color: var(--dim);
    cursor: pointer; transition: all .2s; font-size: 13px; line-height: 1.7; }
  .drop.on { border-color: var(--gold); color: var(--gold); background: rgba(212,169,110,.06); }
  .drop b { color: var(--text); }
  fieldset { border: none; margin-top: 16px; }
  legend, .lbl { font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; display: block; }
  .seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 9px 4px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; font-size: 12.5px; transition: all .15s; }
  .seg button.act { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 12px rgba(212,169,110,.08); }
  input[type=text] { width: 100%; padding: 8px 10px; margin-bottom: 10px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; font-size: 13px; outline: none; }
  input[type=text]:focus { border-color: var(--gold); }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--dim); margin: 8px 0 2px; }
  .row output { color: var(--text); }
  select { width: 100%; padding: 8px; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; font-size: 13px; }
  .hint { font-size: 11px; color: var(--dim); margin: 2px 0 10px; line-height: 1.5; }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .btns button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
  #gen { background: linear-gradient(135deg, #d4a96e, #b8863f); color: #241a08; }
  #dl  { background: var(--panel2); color: var(--text); border: 1px solid var(--line) !important; }
  #status { margin-top: 14px; font-size: 11.5px; color: var(--dim); line-height: 1.6; min-height: 32px; }
  #status.warn { color: #e0b458; } #status.err { color: #e06c5f; }
  canvas#stage { max-width: 92%; max-height: 94vh; border-radius: 8px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
  #placeholder { color: #3a4657; font-size: 15px; letter-spacing: 2px; text-align:center; line-height: 2.2; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--dim); border-top-color:var(--gold);
    border-radius:50%; animation:r 0.8s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes r { to { transform: rotate(360deg);} }
</style>
</head>
<body>
<aside>
  <h1>方舟蚀刻章设计器</h1>
  <div class="sub">玩家二创工具，与官方无关 · 参照公开官方素材归纳的设计语言<br>方舟：同心套环 · 哑光网点 · 横幅字带　终末地：阳极氧化金属 · 章内铭牌框 · 章面极简　糖果：贴纸缝线 · 名字气泡<br>全程本地处理，照片不会上传</div>

  <div class="drop" id="drop">
    <b>点击 / 拖入 / 粘贴</b> 照片<br>建议：主体清晰、背景简洁的照片效果最佳
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <fieldset>
    <legend>章体模板</legend>
    <div class="seg">
      <button id="m-ak" class="act">方舟蚀刻章</button>
      <button id="m-ef">终末地蚀刻章</button>
      <button id="m-cd">糖果贴纸章</button>
    </div>
    <span class="lbl">品阶 / 色调</span>
    <select id="tone">
      <option value="silver">晋升银（标准款）</option>
      <option value="plated">镀层（全息）</option>
      <option value="gold">活动金章</option>
      <option value="stamp">朱砂印章</option>
    </select>
    <div id="famWrap" style="display:none">
      <span class="lbl">形制家族</span>
      <select id="fam">
        <option value="story">story · 剧情/陈列章</option>
        <option value="combat">combat · 计数章</option>
        <option value="industry">industry · 工业五金铭牌（工业/调度）</option>
      </select>
    </div>
    <div class="hint" id="hint">哑光网点底 · 多层同心套环 · 嵌入式横幅字带</div>
    <div id="patWrap" style="display:none">
      <span class="lbl">贴纸底纹</span>
      <select id="pat">
        <option value="radial">径向阳光纹</option>
        <option value="dots">粉彩波点</option>
      </select>
    </div>
  </fieldset>

  <fieldset>
    <legend>铭文</legend>
    <input type="text" id="t-main" value="蚀刻勋章" placeholder="主铭文（方舟横幅字带 / 糖果名字气泡）">
    <input type="text" id="t-sub" value="" placeholder="顶部标签（方舟用，可选）">
    <input type="text" id="t-num" value="" placeholder="数字层级（可选，如 100）">
    <input type="text" id="t-ser" value="" placeholder="编号注释（可选，如 NO.006）">
  </fieldset>

  <fieldset>
    <legend>蚀刻参数</legend>
    <div class="row"><span>线稿强度</span><output id="o-ls">1.0</output></div>
    <input type="range" id="r-ls" min="0.4" max="1.8" step="0.05" value="1.0">
    <div class="row"><span>细节密度</span><output id="o-dt">1.0</output></div>
    <input type="range" id="r-dt" min="0.5" max="2.0" step="0.05" value="1.0">
    <label class="row" style="cursor:pointer"><span>跳过抠图（整图入章）</span>
      <input type="checkbox" id="no-mat" style="accent-color:var(--gold)"></label>
  </fieldset>

  <div class="btns">
    <button id="gen">生成蚀刻章</button>
    <button id="dl">下载 PNG</button>
  </div>
  <div id="status"><span id="spin" class="spin" style="display:none"></span><span id="status-text">等待上传照片…</span></div>
</aside>
<main>
  <canvas id="stage" width="1000" height="1150"></canvas>
  <div id="placeholder">◈ 照片将在此呈现为蚀刻章 ◈</div>
</main>
<script type="module">
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), statusEl = $('status'), statusText = $('status-text'), spinEl = $('spin');
let srcImage = null, srcUrl = null, outBlob = null;

function setStatus(msg, cls='', spin=false) {
  statusEl.className = cls; statusText.textContent = msg;
  spinEl.style.display = spin ? '' : 'none';
}

/* ---------------- 上传 ---------------- */
const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
file.onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on');
  const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadFile(f); };
window.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) loadFile(it.getAsFile());
});
function loadFile(f) {
  const url = URL.createObjectURL(f);
  if (srcUrl) URL.revokeObjectURL(srcUrl);   // 释放上一张的 blob URL（srcImage 已被替换）
  srcUrl = url;
  const img = new Image();
  img.onload = () => { srcImage = img; setStatus(`已载入 ${img.naturalWidth}×${img.naturalHeight}，点击「生成蚀刻章」`); generate(); };
  img.onerror = () => { URL.revokeObjectURL(url); if (srcUrl === url) srcUrl = null; setStatus('图片载入失败', 'err'); };
  img.src = url;
}

/* ---------------- 抠图：优先本地 vendor 模型，回退 CDN / 内置算法 ---------------- */
let rembgFn = undefined, rembgSource = '', rembgTried = false;
const IMGLY_VERSION = '1.5.5';
const CDN_LIST = [
  'https://esm.sh/@imgly/background-removal@' + IMGLY_VERSION,
  'https://cdn.jsdelivr.net/npm/@imgly/background-removal@' + IMGLY_VERSION + '/+esm',
  'https://unpkg.com/@imgly/background-removal@' + IMGLY_VERSION + '?module',
];
async function getRembg() {
  if (rembgTried) return rembgFn;
  rembgTried = true;
  // 1) 仓库内置 vendor 副本（离线可用，零 CDN 信任面）
  try {
    setStatus('正在加载本地 AI 抠图模型…', '', true);
    const mod = await import('./vendor/imgly/index.mjs');
    const fn = mod.removeBackground || mod.default;
    if (typeof fn === 'function') { rembgFn = fn; rembgSource = 'local'; return fn; }
  } catch (e) { /* 回退 CDN */ }
  // 2) 公共 CDN（版本锁定）
  for (const url of CDN_LIST) {
    try {
      setStatus(`正在加载 AI 抠图模型（仅首次，约几十 MB）…`, '', true);
      const mod = await import(url);
      const fn = mod.removeBackground || mod.default;
      if (typeof fn === 'function') { rembgFn = fn; rembgSource = 'cdn'; return fn; }
    } catch (e) { /* 下一个 CDN */ }
  }
  rembgFn = null;
  return null;
}
async function aiCut(img) {
  const fn = await getRembg();
  if (!fn) return null;
  try {
    const opts = { device: 'cpu' };
    if (rembgSource === 'local') opts.publicPath = './vendor/imgly-data/';
    const blob = await fn(await (await fetch(img.src)).blob(), opts);
    const bmp = await createImageBitmap(await blob);
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    // 镜像引擎 `badge_engine.py` 的抠图覆盖度闸（`cov = mean(alpha)/255`，
    // 判退条件 `cov < 0.04 or cov > 0.96` 与引擎同式同值，由同步钉子 `MATTING_PINS` 钉住）。
    // 显著性模型对无人物/无物体的照片常「整图无输出」：覆盖度过低 = 根本没抠到主体，
    // 而这张近乎全透明的图仍会被当成主体 ⇒ 交付出一张近乎空白的盘（本机 12 张池照实测 4 张）。
    // 引擎为此退回经典链路（它自己会再退成整图入章 = 有设计的满铺支），网页此前漏了这道闸。
    window.__aicov = null;
    const ad = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    let asum = 0;
    for (let i = 3; i < ad.length; i += 4) asum += ad[i];
    const cov = asum / (ad.length / 4) / 255;
    window.__aicov = cov;
    if (cov < 0.04 || cov > 0.96) return null;
    return c;
  } catch (e) { return null; }
}
async function classicCut(img) {
  const MAX = 640, sc = Math.min(1, MAX / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const N = w * h;
  const px = i => [d[i*4], d[i*4+1], d[i*4+2]];
  const borderIdx = [];
  for (let x = 0; x < w; x++) { borderIdx.push(x, (h-1)*w + x); }
  for (let y = 0; y < h; y++) { borderIdx.push(y*w, y*w + w - 1); }
  let centers = [];
  for (let k = 0; k < 6; k++) centers.push(px(borderIdx[Math.floor(k*(borderIdx.length-1)/5)]));
  for (let it = 0; it < 10; it++) {
    const acc = centers.map(() => [0,0,0,0]);
    for (const bi of borderIdx) {
      const p = px(bi); let best = 0, bd = Infinity;
      centers.forEach((ct, ci) => { const dd0=(p[0]-ct[0])**2+(p[1]-ct[1])**2+(p[2]-ct[2])**2; if(dd0<bd){bd=dd0;best=ci;} });
      acc[best][0]+=p[0];acc[best][1]+=p[1];acc[best][2]+=p[2];acc[best][3]++;
    }
    centers = centers.map((ct,ci)=> acc[ci][3] ? [acc[ci][0]/acc[ci][3],acc[ci][1]/acc[ci][3],acc[ci][2]/acc[ci][3]] : ct);
  }
  const TOL = 26;
  const dbg=new Float32Array(N), coreBg=new Uint8Array(N), barrier=new Uint8Array(N);
  for (let i=0;i<N;i++){ const p=px(i); let m=Infinity;
    for(const ct of centers){const dd0=(p[0]-ct[0])**2+(p[1]-ct[1])**2+(p[2]-ct[2])**2; if(dd0<m)m=dd0;}
    dbg[i]=Math.sqrt(m); coreBg[i]=dbg[i]<=TOL?1:0; barrier[i]=dbg[i]>=TOL+30?1:0; }
  // 整段洪泛抽成 `flood(tolLocal,tolGlobal)`，为的是复刻引擎 `extract_subject`
  // （badge_engine.py:236-241）的**紧容差重试**——覆盖率出带时先用 `tolerance*0.62` 再泛一次，
  // 仍出带才放弃。网页此前一次出带就 `return null`，等于把引擎的第二把机会省掉了。
  // 判退/判放的口径（`cov<0.04||cov>0.96`）与引擎同式同值，由同步钉子 `CLASSIC_PINS` 钉住。
  function flood(tolLocal,tolGlobal){
    const tl2=tolLocal*tolLocal*3, tg2=tolGlobal*tolGlobal*3;
    const bg=new Uint8Array(N); const q=[];
    const push=i=>{ if(!bg[i]&&!barrier[i]){bg[i]=1;q.push(i);} };
    for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}
    for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
    while(q.length){
      const i=q.pop(); const p=px(i);
      let near=false;
      for(const ct of centers){ if((p[0]-ct[0])**2+(p[1]-ct[1])**2+(p[2]-ct[2])**2<=tg2){near=true;break;} }
      const x=i%w,y=(i/w)|0;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const j=ny*w+nx;
        if(bg[j]||barrier[j])continue;
        if(near){bg[j]=1;q.push(j);continue;}
        const pj=px(j);
        if((pj[0]-p[0])**2+(pj[1]-p[1])**2+(pj[2]-p[2])**2<=tl2){bg[j]=1;q.push(j);}
      }
    }
    return bg;
  }
  function fgOf(bg){ const f=new Uint8Array(N); for(let i=0;i<N;i++) f[i]=(bg[i]||coreBg[i])?0:1; return f; }
  function covOf(f){ let s=0; for(let i=0;i<N;i++) s+=f[i]; return s/N; }
  let fg=fgOf(flood(TOL,TOL+8));
  let cov=covOf(fg);
  window.__classiccov = cov;
  if(cov<0.04||cov>0.96){ fg=fgOf(flood(TOL*0.62,TOL*0.62+5)); cov=covOf(fg); window.__classiccov=cov; }
  if(cov<0.04||cov>0.96) return null;
  // 连通域多部件
  const lbl=new Int32Array(N); const sizes={}; let cur=0;
  for(let s=0;s<N;s++){
    if(!fg[s]||lbl[s])continue;
    cur++; let sz=0; const qq=[s]; lbl[s]=cur;
    while(qq.length){
      const i=qq.pop(); sz++;
      const x=i%w,y=(i/w)|0;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const j=ny*w+nx;
        if(fg[j]&&!lbl[j]){lbl[j]=cur;qq.push(j);}
      }
    }
    sizes[cur]=sz;
  }
  const allSizes=Object.values(sizes);
  // 引擎的**碎片化否决**——主体被切成离散碎片时宁可整图回退，也不输出碎片。
  // 分母是 `min_keep` **之前**的全量连通域（与引擎 `_main_components` 返回的 `sizes` 同一口径）：
  // 12 张池照实测连通域数 488~5648 ⇒ `len>=6` 恒成立 ⇒ 引擎的经典链路在真照片上**一张都不出掩膜**，
  // 全部整图回退。网页缺这一条，于是把碎片当主体送进合成（`object_arch` 实测只剩三个小碎片）。
  if(allSizes.length){
    const tot=allSizes.reduce((a,b)=>a+b,0), big0=Math.max(...allSizes);
    window.__classicfrag = (big0 < tot*0.55) || (allSizes.length >= 6);
    if(window.__classicfrag) return null;
  } else window.__classicfrag = false;
  const biggest=Math.max(...allSizes);
  const minKeep=Math.max(biggest*0.06,N*0.002,64);
  const keepSet=new Set(Object.entries(sizes).filter(([,sz])=>sz>=minKeep).map(([k])=>+k));
  let kept=new Uint8Array(N);
  for(let i=0;i<N;i++) if(fg[i]&&keepSet.has(lbl[i])) kept[i]=1;
  // 填洞
  const outside=new Uint8Array(N); const oq=[];
  const invPush=i=>{if(!kept[i]&&!outside[i]){outside[i]=1;oq.push(i);}};
  for(let x=0;x<w;x++){invPush(x);invPush((h-1)*w+x);}
  for(let y=0;y<h;y++){invPush(y*w);invPush(y*w+w-1);}
  while(oq.length){
    const i=oq.pop(); const x=i%w,y=(i/w)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=w||ny>=h)continue;
      const j=ny*w+nx; if(!kept[j]&&!outside[j]){outside[j]=1;oq.push(j);}
    }
  }
  for(let i=0;i<N;i++) if(!kept[i]&&!outside[i]) kept[i]=1;
  kept=morph(morph(kept,w,h,false),w,h,true);
  const alpha=feather(kept,w,h);
  const out=document.createElement('canvas'); out.width=img.width; out.height=img.height;
  const oc=out.getContext('2d');
  oc.drawImage(img,0,0);
  const od=oc.getImageData(0,0,out.width,out.height);
  const bigA=resizeAlpha(alpha,w,h,out.width,out.height);
  for(let i=0;i<out.width*out.height;i++) od.data[i*4+3]=bigA[i];
  oc.putImageData(od,0,0);
  return out;
}
function morph(m,w,h,dilate){
  const r=new Uint8Array(m.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let v=dilate?0:1;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const nx=x+dx,ny=y+dy;
      const s=(nx<0||ny<0||nx>=w||ny>=h)?0:m[ny*w+nx];
      v=dilate?(v|s):(v&s);
    }
    r[y*w+x]=v;
  }
  return r;
}
function feather(m,w,h){
  let a=Float32Array.from(m);
  for(let pass=0;pass<2;pass++){
    const t=new Float32Array(a.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let s=0,n=0;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        s+=a[ny*w+nx];n++;
      }
      t[y*w+x]=s/n;
    }
    a=t;
  }
  return a;
}
function resizeAlpha(a,w,h,W,H){
  const out=new Uint8ClampedArray(W*H);
  for(let y=0;y<H;y++){
    const sy=Math.min(h-1,(y*h/H)|0);
    for(let x=0;x<W;x++){
      const sx=Math.min(w-1,(x*w/W)|0);
      out[y*W+x]=Math.round(a[sy*w+sx]*255);
    }
  }
  return out;
}

/* ---------------- 通用工具 ---------------- */
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function rgb(arr){ return `rgb(${arr[0]|0},${arr[1]|0},${arr[2]|0})`; }
function rgba(arr,alpha){ return `rgba(${arr[0]|0},${arr[1]|0},${arr[2]|0},${alpha})`; }
function hsv2rgb(h,s,v){
  const i=Math.floor(h*6), f=h*6-i;
  const p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  let r,g,b;
  switch(i%6){
    case 0: r=v; g=t; b=p; break;
    case 1: r=q; g=v; b=p; break;
    case 2: r=p; g=v; b=t; break;
    case 3: r=p; g=q; b=v; break;
    case 4: r=t; g=p; b=v; break;
    default: r=v; g=p; b=q;
  }
  return [r*255, g*255, b*255];
}
function toCanvas(im){
  // 输入降采样上限：防超大图把 canvas/getImageData 内存打爆（引擎侧等价防护为 80MP 上限）
  const MAX_INPUT_DIM = 4096;
  let w = im.naturalWidth||im.width, h = im.naturalHeight||im.height;
  const sc = Math.min(1, MAX_INPUT_DIM/Math.max(w,h));
  w = Math.max(1, Math.round(w*sc)); h = Math.max(1, Math.round(h*sc));
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(im,0,0,w,h);
  return c;
}
function hasAlphaCanvas(c){
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
  for(let i=3;i<d.length;i+=4) if(d[i]<220) return true;
  return false;
}
function cropToSubjectCanvas(src,padRatio=0.03){
  const d=src.getContext('2d').getImageData(0,0,src.width,src.height).data;
  let minX=1e9,minY=1e9,maxX=-1,maxY=-1;
  for(let y=0;y<src.height;y++)for(let x=0;x<src.width;x++)
    if(d[(y*src.width+x)*4+3]>24){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  if(maxX<0) return src;
  const pw=Math.round((maxX-minX)*padRatio), ph=Math.round((maxY-minY)*padRatio);
  minX=Math.max(0,minX-pw); minY=Math.max(0,minY-ph);
  maxX=Math.min(src.width-1,maxX+pw); maxY=Math.min(src.height-1,maxY+ph);
  const c=document.createElement('canvas'); c.width=maxX-minX+1; c.height=maxY-minY+1;
  c.getContext('2d').drawImage(src,minX,minY,c.width,c.height,0,0,c.width,c.height);
  return c;
}
function minAlpha(c){
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
  let m=255;
  for(let i=3;i<d.length;i+=4) if(d[i]<m) m=d[i];
  return m;
}
function cropToMask(canvas, maskCanvas){
  const tmp=document.createElement('canvas'); tmp.width=canvas.width; tmp.height=canvas.height;
  const tx=tmp.getContext('2d');
  tx.drawImage(canvas,0,0);
  tx.globalCompositeOperation='destination-in';
  tx.drawImage(maskCanvas,0,0);
  const x=canvas.getContext('2d');
  x.clearRect(0,0,canvas.width,canvas.height);
  x.drawImage(tmp,0,0);
}
function applyGrain(canvas,seed,amp){
  const x=canvas.getContext('2d');
  const id=x.getImageData(0,0,canvas.width,canvas.height);
  const d=id.data, rng=mulberry32(seed);
  const span=amp*2+1;
  for(let i=0;i<d.length;i+=4){
    const n=Math.round(rng()*span)-amp;
    d[i]  =Math.max(0,Math.min(255,d[i]+n));
    d[i+1]=Math.max(0,Math.min(255,d[i+1]+n));
    d[i+2]=Math.max(0,Math.min(255,d[i+2]+n));
  }
  x.putImageData(id,0,0);
}

/* ---------------- 蚀刻纹章化（对齐引擎 v16 line 公式 + 整图回退美化） ---------------- */
// 回退支自动色阶的章面明度跨度门限（灰阶），与引擎 FALLBACK_POLISH_SPAN_MIN 同值：
// 章面自己没拉开时（纯色/雾天输入只剩排线的 0.1~8 灰阶）自动色阶 = 42 倍增益，
// 会把不可见的排线刻成满章深线。门限由平坦类与细节类输入的章面灰阶跨度间隙定出，不是拍脑袋定的。
// 网页 etchFace() 只有 line 一档（无 mode 参数），故这里等价于引擎的 `mode!=="line" ||` 前置。
const FALLBACK_POLISH_SPAN_MIN = 17;
// 电平分带数，与引擎 RELIEF_BANDS 同值：官方章面读作「几层平涂的蚀刻台 + 硬边」，
// 连续坡道读作「贴在金属上的一张照片」。
const RELIEF_BANDS = 4;
// 分带强度，与引擎 QBAND_LAM 同值：0 = 均匀台阶，1 = 带边完全落在场自身的分位上。
// 照片场的质量集中在高端，均匀台阶会把中间调整段并进同一级 ⇒ 章面"看不出刻了什么"。
// 取 0.7 不是 1.0：四等分质量让最低一级独占 25% 像素，λ=1 把暗主体压成黑剪影、亮主体推成白纸。
const QBAND_LAM = 0.7;
// FB-18 满铺支的带数与并块，与引擎 FB_BANDS / FB_CLEAN 同值（上岗档 3 / 2）。
// 病不在电平在**带图的连通性**：照片量化后带界两侧全是几像素大的岛，浮雕又在每条岛界上补棱
// ⇒ 章面读作中灰迷彩。取档 = 12 张真照片全池扫（引擎侧 `output/_fb18/fb18_pool.log`）。
// 只作用于 `fallbackRelief()`（整图入章支）；剪影支在网页无对应物 ⇒ 不欠这一份镜像。

const FB_CLEAN = 2;
// ---- 章面电平（与引擎 PLATE_* 同值 · 2026-10-12 坡道顶端/电平闭环轮）----
// 金档坡道顶端收到 mid：官方章面最亮处仍是暖金，近白只出现在蚀刻笔画上，
// 一路推到 bright=(252,250,240) 会把逆光照片的天空渲成一张白纸。

const PLATE_TOP_TONES = ["ef_gold"];

// SILO_SHADE_*：纹章落影的颜色。engrave 在六档里五档是近白 ⇒ 旧写法把"影"画成一圈白。

// 方向性浮雕，与引擎 EMBOSS_* 同值：单调的「电平→颜色」坡道只给明暗、不给凸起，

const EMBOSS_LO = 0.72;

const EMBOSS_LY = -0.60;
const EMBOSS_NORM_PCT = 92;

// 与引擎一样在**浮雕之后**压上去：让线参与浮雕会把斜率分位归一的预测顶大、把主棱边冲淡。

const ENG_SOFT = 0.30;               // 线剖面软边（相位单位）
const ENG_DARK_K = 1.6;              // 明暗→线宽的增益
const ENG_FLOOR = 0.22;              // 最亮处的线深（避免高光变成死白平涂）
const ENG_EDGE_SUPPRESS = 0.75;      // 强边附近排线让路

const ENG_TONES = ["ef_gold", "ef_silver"];

// 引擎 `_box_mean` 同式：edge 填充 + 可分离箱式均值，全程 float64（过 uint8 会被量化噪声吃掉）。
function boxMean2d(a, fw, fh, r){
  const k = Math.max(1, Math.round(r)), w = 2 * k + 1;
  const t = new Float64Array(fw * fh);
  const row = new Float64Array(fw + 2 * k), cr = new Float64Array(fw + 2 * k + 1);
  for(let y = 0; y < fh; y++){
    const b = y * fw;
    for(let x = 0; x < fw; x++) row[k + x] = a[b + x];
    row.fill(a[b], 0, k);
    row.fill(a[b + fw - 1], k + fw, row.length);
    let acc = 0;
    for(let i = 0; i < row.length; i++){ acc += row[i]; cr[i + 1] = acc; }
    for(let x = 0; x < fw; x++) t[b + x] = (cr[x + w] - cr[x]) / w;
  }
  const out = new Float64Array(fw * fh);
  const col = new Float64Array(fh + 2 * k), cc = new Float64Array(fh + 2 * k + 1);
  for(let x = 0; x < fw; x++){
    for(let y = 0; y < fh; y++) col[k + y] = t[y * fw + x];
    col.fill(t[x], 0, k);
    col.fill(t[(fh - 1) * fw + x], k + fh, col.length);
    let acc = 0;
    for(let i = 0; i < col.length; i++){ acc += col[i]; cc[i + 1] = acc; }
    for(let y = 0; y < fh; y++) out[y * fw + x] = (cc[y + w] - cc[y]) / w;
  }
  return out;
}

// numpy `np.percentile(v, pct)` 同式：排序后线性插值（pos = q*(n-1)，含端点）。
function percentile1d(v, pct){
  const s = Float64Array.from(v).sort();
  const n = s.length, pos = (pct / 100.0) * (n - 1);
  const i0 = Math.floor(pos), i1 = Math.min(n - 1, i0 + 1);
  return s[i0] + (s[i1] - s[i0]) * (pos - i0);
}

// 引擎 `_linestop_amp(cont, sel, p, win, q, floor)` 同式。
// 单边差 + **末位复制**（不是末位补零）：中心差会把首末行列的斜率算成半值 ⇒ 数组四边
// 长出一圈假静区（引擎注释里的 A7b 就是这么翻车的）。
// `sel`（剪影支）= 主体掩膜：门限只取**主体自身**活动性的分位（引擎 `act[sel]`）；
// 缺省（满铺支的 `null`）= 满幅分位，与引擎 `sel=None` 同口径 ⇒ 既有调用点一字不改。
function linestopAmp(l, fw, fh, p, win, q, floor, sel){
  const n = fw * fh, dy = new Float64Array(n), dx = new Float64Array(n);
  for(let y = 0; y < fh; y++){
    const yb = Math.min(y, fh - 2), b = y * fw;
    for(let x = 0; x < fw; x++) dy[b + x] = Math.abs(l[(yb + 1) * fw + x] - l[yb * fw + x]);
  }
  for(let y = 0; y < fh; y++){
    const b = y * fw;
    for(let x = 0; x < fw; x++){
      const xb = Math.min(x, fw - 2);
      dx[b + x] = Math.abs(l[b + xb + 1] - l[b + xb]);
    }
  }
  const half = win / 2.0;
  const act = new Float64Array(n);
  for(let i = 0; i < n; i++) act[i] = Math.hypot(dy[i], dx[i]);
  const a2 = boxMean2d(boxMean2d(act, fw, fh, half), fw, fh, half);
  // 门限样本 = 主体内（`act[sel]`）；`sel` 全 0（主体一个像素都没有）⇒ 退回满幅，与引擎
  // `sel.any()` 那一条同式。满铺支传 null ⇒ 一直是满幅。
  let v = a2;
  if(sel){
    const acc = [];
    for(let i = 0; i < n; i++) if(sel[i]) acc.push(a2[i]);
    if(acc.length) v = acc;
  }
  const th = percentile1d(v, 100.0 * Math.min(Math.max(q, 0.0), 1.0));
  const amp = new Float64Array(n);
  if(th <= 1e-9){ amp.fill(1.0); return amp; }   // 场没有可分的活动性 ⇒ 不动（= N-11）
  for(let i = 0; i < n; i++){

}

// 把四边一整圈的脊悄悄抹掉而读数照样"看着对"（本机坑 ㊴ 那一类死在负偏移/边界上的写法）。

function ridgeCore(edgeArr, fw, fh, tau, radius){

  // th=0.5+0.4ulp 时 0.5>=th 为 True ⇒ 比的是 float32 那一份）。JS 全程 float64 ⇒ 这里显式

  const th = Math.fround(tau * Math.max(percentile1d(edgeArr, 99.0), 1e-6));
  const k = new Float64Array(n);

  for(let y = 0; y < fh; y++){
    const up = ((y + 1) % fh) * fw, dn = ((y - 1 + fh) % fh) * fw, rb = y * fw;
    for(let x = 0; x < fw; x++){
      const i = rb + x, e = edgeArr[i];
      if(e >= th && e >= edgeArr[up + x] && e >= edgeArr[dn + x]

        k[i] = 1.0; cnt++;

  const sm = boxMean2d(boxMean2d(k, fw, fh, r), fw, fh, r);

  for(let i = 0; i < n; i++) if(sm[i] > peak) peak = sm[i];

  for(let i = 0; i < n; i++) core[i] = Math.min(1.0, Math.max(0.0, sm[i] / d));

// 与引擎 _engrave_ink + _engrave_shade 同式：**零均值乘性**调制 rgb ← rgb·exp(−ENG_GAIN·(ink−ī))。
// 先全幅算 ink 并累加求 ī（两趟），再统一施加 ⇒ 与引擎的 `ink - ink.mean()` 同一个均值口径。
// 单边朝 lo_c 拉（旧式 rgb+(lo_c−rgb)·ink·gain）会把电平一起拉塌：隔离树实测章面暗部一格
// +27.3pp、均值掉 11.7 灰阶。只在**末尾** clip（引擎也是整条浮点链走完后一次性 clip）。
// `amp`（FB-8）= 逐像素的调制资格：均值改按 amp 加权、`c = amp·(ink−加权均值)`
// ⇒ amp=0 处调制**恰好为零**（真静，不是被补偿抬亮）。`amp` 缺省 = 改前算式（引擎 amp=None）。
// `ridge/mix`（LN-2）= 笔迹来源换成线中心脊：与引擎同式，脊**不参与**上面那条「强边让路」抑制
// （它本身就长在强边上）。两者缺省 = 改前算式（引擎 ridge=None / mix=0）。
// `gain/period`（剪影支）= 引擎 `_engrave_shade(gain=EMBLEM_GAIN, period=EMBLEM_PERIOD)`：
// 剪影支的主体内线间距单独取档（10.0），借全局 `MEDAL_ENG_PERIOD`（5.0）会把满铺支一起加粗，
// 那条债登记在引擎同处（㊾：作用面只能靠调用点隔离）。缺省（不传）⇒ 全局 ENG_GAIN/ENG_PERIOD
// ⇒ 现有两处调用点（line 主干、满铺支）算式逐字不变。`period<=0` = 跟随全局，与引擎
// `period=(EMBLEM_PERIOD or None)` 同式。
function engraveShade(rgbF, field, edgeArr, fw, fh, amp, ridge, mix, gain, period){
  const g = (gain == null ? ENG_GAIN : gain);
  const pd = (period == null || period <= 0.0 ? ENG_PERIOD : period);
  const th = ENG_ANGLE * Math.PI / 180, sn = Math.sin(th), cs = Math.cos(th);
  const n = fw * fh, ink = new Float32Array(n);

  for(let y = 0; y < fh; y++) for(let x = 0; x < fw; x++){
    const i = y * fw + x;
    const phase = ((x * sn + y * cs) / pd) % 1.0;
    const tri = 1.0 - Math.abs(phase - 0.5) * 2.0;                     // 线中心三角波
    const depth = Math.min(1, Math.max(0, ENG_FLOOR + (1 - field[i]) * ENG_DARK_K));
    let v = Math.min(1, Math.max(0, (tri - (1 - depth)) / ENG_SOFT));
    v *= Math.min(1, Math.max(0, 1 - edgeArr[i] * ENG_EDGE_SUPPRESS));
    if(ridge && mix > 0.0){
      const rink = Math.min(1, Math.max(0, (ridge[i] - (1 - depth)) / ENG_SOFT));
      v = v * (1 - mix) + rink * mix;
    }
    ink[i] = v; sum += v;

  const mean = sum / n;
  let mu = mean, a = null;
  if(amp){
    a = new Float64Array(n);
    let sw = 0.0, sa = 0.0;
    for(let i = 0; i < n; i++){
      const v = Math.min(1.0, Math.max(0.0, amp[i]));
      a[i] = v; sw += v; sa += v * ink[i];
    }
    if(sw > 1e-6) mu = sa / sw;
  }
  for(let i = 0; i < n; i++){
    const c = a ? a[i] * (ink[i] - mu) : ink[i] - mu;
    const f = Math.exp(-g * c), b3 = i * 3;
    for(let k = 0; k < 3; k++) rgbF[b3 + k] *= f;
  }
}

function grayFlat(rgbaCanvas){
  const c=document.createElement('canvas');c.width=rgbaCanvas.width;c.height=rgbaCanvas.height;

function blurLuma(g,wd,ht,sigma){
  const c=document.createElement('canvas');c.width=wd;c.height=ht;
  const cx=c.getContext('2d');
  const im=cx.createImageData(wd,ht);
  for(let i=0;i<wd*ht;i++){im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=Math.max(0,Math.min(255,g[i]*255));im.data[i*4+3]=255;}

  const bc=b.getContext('2d');

  const bd=bc.getImageData(0,0,wd,ht).data;
  const out=new Float32Array(wd*ht);
  for(let i=0;i<wd*ht;i++)out[i]=bd[i*4]/255;

function blurSigned(a,wd,ht,sigma){
  const c=document.createElement('canvas');c.width=wd;c.height=ht;
  const cx=c.getContext('2d');
  const im=cx.createImageData(wd,ht);
  for(let i=0;i<wd*ht;i++){const v=Math.max(0,Math.min(255,(a[i]+1)*127.5));im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}
  cx.putImageData(im,0,0);
  const b=document.createElement('canvas');b.width=wd;b.height=ht;
  const bc=b.getContext('2d');
  bc.filter=`blur(${sigma}px)`;bc.drawImage(c,0,0);
  const bd=bc.getImageData(0,0,wd,ht).data;
  const out=new Float32Array(wd*ht);
  for(let i=0;i<wd*ht;i++)out[i]=bd[i*4]/127.5-1;

/* 复刻引擎 _emboss：电平场的方向斜率 → 按自身 92 分位归一 → 高斯 σ0.9。
   分带后斜率只在台界上非零 ⇒ 回来的棱正好落在硬边上。 */
function embossField(t,wd,ht,strength){
  const n=wd*ht, sh=new Float32Array(n);
  if(wd<2||ht<2) return sh;
  for(let y=0;y<ht;y++){
    const r=y*wd;
    for(let x=0;x<wd;x++){
      const i=r+x;
      // np.gradient 的口径：内点中心差分，两端退化成一阶单侧差分
      const gx=(x===0)?t[i+1]-t[i]:(x===wd-1)?t[i]-t[i-1]:(t[i+1]-t[i-1])*0.5;
      const gy=(y===0)?t[i+wd]-t[i]:(y===ht-1)?t[i]-t[i-wd]:(t[i+wd]-t[i-wd])*0.5;
      sh[i]=-(gx*EMBOSS_LX+gy*EMBOSS_LY);

  const ar=new Float64Array(n);
  for(let i=0;i<n;i++)ar[i]=Math.abs(sh[i]);
  const s=ar.sort(), p=(n-1)*EMBOSS_NORM_PCT/100, lo=Math.floor(p), fr=p-lo;
  const scale=(lo+1<n)?s[lo]+(s[lo+1]-s[lo])*fr:s[n-1];
  if(!(scale>1e-5)) return sh;   // 平坦场没有方向可言：与引擎一样原样不动
  const q=new Float32Array(n);
  for(let i=0;i<n;i++)q[i]=Math.max(-1,Math.min(1,sh[i]/scale*strength));
  return blurSigned(q,wd,ht,0.9);

/* 与引擎 _plate_top 同式：照片亮度驱动的两支坡道顶端落点。 */
function plateTop(pal,toneKey){
  const b=pal[2];

  return [0,1,2].map(k=>pal[1][k]+(b[k]-pal[1][k])*PLATE_TOP_K);

/* 与引擎 _posterize 同式：带边在「均匀台阶」与「场自身的分位」之间按 QBAND_LAM 插值。

   漏镜像不会报错，只会让网页章面回到"糊成一张复印件"⇒ check_web_sync 逐字钉这两处调用点。
   `bands` = 引擎 `_posterize(t, bands)` 的形参：FB-18 之前这里**硬用全局 RELIEF_BANDS**，
   于是满铺支换带数时锚与最终分带用的是两把带边（引擎 fb4 踩过的那条）。缺省档必须与

  const B=bands||RELIEF_BANDS;

  s.sort();
  const c=new Float64Array(B-1);
  for(let b=0;b<B-1;b++){
    const p=(n-1)*(b+1)/B, lo=Math.floor(p), fr=p-lo;
    const q=(lo+1<n)?s[lo]+(s[lo+1]-s[lo])*fr:s[n-1];
    c[b]=(1.0-QBAND_LAM)*((b+0.5)/(B-1))+QBAND_LAM*q;

// 带数从 `cuts.length` 反推（= 引擎的 `bands-1`），不再读全局 ⇒ 缺省档下与改前同式。
function bandLevel(v,cuts){
  const x=Math.min(1,Math.max(0,v));

  if(QBAND_LAM<=0.0) return Math.round(x*B)/B;

/* 与引擎 _band_collapse 同式：对**分带索引图**做圆盘多数表决，把碎斑并进邻域主体。
   平票口径 = 票数×2 + 自身 1 票 ⇒ 严格多数才翻盘；并列时取**最小带号**，与 numpy
   `argmax` 返回第一个最大值同规则。邻域按 `np.pad(mode="edge")` 的口径夹边（引擎坑 ㊴）。 */

  const g=new Float32Array(n);
  for(let i=0;i<n;i++)g[i]=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;
  // FB-18：带数与并块只在这**一段**里接线（引擎同口径：作用面靠调用点，不靠常数）。
  // `bandsFb` 同时喂锚与最终分带 ⇒ 二者用同一把带边，锚不会把带数的效果补偿掉。
  const bandsFb = FB_BANDS > 0 ? FB_BANDS : RELIEF_BANDS;
  const l=plateLevelLock(blurLuma(g,fw,fh,0.6+FACE_SMOOTH),n,toneKey,loC,hiC,bandsFb);
  const cuts=bandCuts(l,n,bandsFb);
  const lv=new Float64Array(n);
  for(let i=0;i<n;i++) lv[i]=bandLevel(Math.max(0,Math.min(1,l[i])),cuts);
  // 并块在**索引图**上投票（引擎 `p_fb = _band_collapse(p_fb, FB_CLEAN, bands=)` 同位）：
  // 先分带、后并块，坡道与墨线都在它之后 ⇒ 岛界不会被浮雕再补一遍棱。
  const pB = FB_CLEAN > 0 ? bandCollapse(lv,fw,fh,FB_CLEAN,bandsFb) : lv;
  const t=new Float32Array(n);
  for(let i=0;i<n;i++){
    // 分带：与引擎 _posterize 同式，先量化电平再上坡道，斜率只在台界上非零。
    // 墨线在坡道**之后**、clip 之前进加法（与引擎同序）：负值 = 把轮廓刻成暗凹槽。
    t[i]=Math.min(1,Math.max(0,0.10+0.90*pB[i]+edgeArr[i]*FACE_INK));
  }
  const sh=embossField(t,fw,fh,EMBOSS_STRENGTH_LINE);
  const rgbF=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const s=sh[i], ph=s>0?s:0, nl=s<0?-s:0;
    for(let k=0;k<3;k++){
      const v=loC[k]+(hiC[k]-loC[k])*t[i];
      // 迎光面往 bright 靠、背光面往 lo_c 靠（与引擎 _emboss 同式，最后统一 clip）
      rgbF[i*3+k]=v+(hiC[k]-v)*ph*EMBOSS_HI+(loC[k]-v)*nl*EMBOSS_LO;
    }
  }
  if(engraveOn(toneKey)){
    // FB-8：门限吃**分带前**的连续场 `l`（不是已分带的 `t`）—— 带内线宽恒定正是病根本身；
    // 主体掩膜传 None 的对应物 = 全幅分位（满铺型照片整幅都是主体）。clip 到 [0,1] 与引擎同式。
    const lc = new Float64Array(n);
    for(let i = 0; i < n; i++) lc[i] = Math.min(1.0, Math.max(0.0, l[i]));
    // LN-2：脊只在这一处接线（与引擎的满铺支调用点一一对应）；line 主干那一次调用不传 ridge ⇒
    // 外溢就是 ㊾ 那笔债。门限吃的是本页的 `edgeArr`（line 支混过 ef 的那张），与引擎 silhouette
    // 满铺支的**未混** `edges` 口径不同 —— 这条差异已在 check_web_sync 与报告里登记，不是漏接。
    const rid = (LA_FB > 0.0 && LA_TAU > 0.0)
      ? ridgeCore(edgeArr, fw, fh, LA_TAU, LA_WIDTH).core : null;
    engraveShade(rgbF,t,edgeArr,fw,fh,
                 FB_STOP > 0.0 ? linestopAmp(lc,fw,fh,FB_STOP,FB_STOP_WIN,FB_STOP_Q,FB_STOP_FLOOR) : null,
                 rid, LA_MIX);
  }
  const od=out.getContext('2d').createImageData(fw,fh);
  for(let i=0;i<n;i++){
    for(let k=0;k<3;k++) od.data[i*4+k]=Math.max(0,Math.min(255,rgbF[i*3+k]));
    od.data[i*4+3]=255;   // 铺满档整块不透明：alpha 满 ⇒ composeEndfield 走 full_bleed 支
  }
  out.getContext('2d').putImageData(od,0,0);
}

/* ===== 剪影支的镜像件（逐条对应 `badge_engine.py` 的同名函数）===== */

// PIL `convert("L")` 的整数口径（本机探针：与 (R*19595+G*38470+B*7471+32768)>>16 逐字节同）。
// 剪影支的章面电平从这里开始，`_gray_arr` 吃的就是这一份，不许换成浮点 0.299 系数。
function luma601(r,g,b){ return (r * 19595 + g * 38470 + b * 7471 + 32768) >> 16; }

// 引擎 `_gauss_arr` 在 [-1,1] 的浮雕场上**再 clip 到 [0,1]** ⇒ 背光那一半在进模糊之前就被抹平，
// `_emboss` 只会长出迎光侧的亮唇。网页 `blurSigned` 保住了负值 ⇒ 那是**引擎没有**的暗侧。
// line 主干早已按 blurSigned 落档并被历轮 A/B 锁死，不回改（回改 = 改前成图不逐字节相同）；
// 新的剪影支按引擎口径用 `blurLuma`（它自带 Math.max(0,·)），这条两侧差异已登记，不是漏接。
function embossSilo(t,fw,fh,strength){
  const n=fw*fh;
  if(fw<2||fh<2) return null;                 // 引擎 scale<1e-5 ⇒ out_rgb 原样返回
  const raw=new Float64Array(n), ar=new Float64Array(n);
  for(let y=0;y<fh;y++){
    const r=y*fw;
    for(let x=0;x<fw;x++){
      const i=r+x;
      const gx=(x===0)?t[i+1]-t[i]:(x===fw-1)?t[i]-t[i-1]:(t[i+1]-t[i-1])*0.5;
      // 行跨距是 `fw`（列数），不是 `fh`（行数）：`np.gradient(t,axis=0)` 取的是上下相邻行，
      // 在扁平数组里就是 ±fw。写成 ±fh 时只有**正方形**章面才碰巧等价（fw=fh），
      // 非正方形 ⇒ 纵向差分采样到斜对角像素 ⇒ 浮雕棱边整体错位且与引擎零相关。
      const gy=(y===0)?t[i+fw]-t[i]:(y===fh-1)?t[i]-t[i-fw]:(t[i+fw]-t[i-fw])*0.5;
      const v=-(gx*EMBOSS_LX+gy*EMBOSS_LY);
      raw[i]=v; ar[i]=Math.abs(v);
    }
  }
  const sc=percentile1d(ar,EMBOSS_NORM_PCT);
  if(!(sc>=1e-5)) return null;
  const q=new Float32Array(n);
  for(let i=0;i<n;i++) q[i]=Math.max(-1,Math.min(1,raw[i]/sc*strength));
  return blurLuma(q,fw,fh,0.9);               // = 引擎 `_gauss_arr(clip(raw/scale*K,-1,1), 0.9)`
}

// 高斯模糊后**直接取回 uint8 通道**：剪影支的章体 alpha 就是引擎的
// `sub.getchannel("A").filter(GaussianBlur(0.5))`，`getextrema()` 读的是模糊后的**字节**，
// 拿 blurLuma 的 0~1 浮点反乘 255 会再经一次 Float32 舍入 ⇒ 边界档（a_min=200 那一格）能量错。
function blurBytes(g,wd,ht,sigma){
  const c=document.createElement('canvas');c.width=wd;c.height=ht;
  const cx=c.getContext('2d');
  const im=cx.createImageData(wd,ht);
  for(let i=0;i<wd*ht;i++){const v=Math.max(0,Math.min(255,g[i]*255));im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255;}
  cx.putImageData(im,0,0);
  const b=document.createElement('canvas');b.width=wd;b.height=ht;
  const bc=b.getContext('2d');
  bc.filter=`blur(${sigma}px)`;bc.drawImage(c,0,0);
  const bd=bc.getImageData(0,0,wd,ht).data;
  const out=new Uint8Array(wd*ht);
  for(let i=0;i<wd*ht;i++) out[i]=bd[i*4];
  return out;
}

// 引擎 `_stretch_lut(np.bincount(g8[av>0.5]), cutoff=1)` 同式（PIL autocontrast 的单通道版）。
// 与 `fallbackRelief` 里的逐通道色阶同规则，但**样本只取块内**、LUT 套回整帧 —— 这是剪影支
// 的关键口径：整帧统计时逆光的亮天会把高光顶到 255，块内仍是一片白（金档渲成过曝奶油）。
function stretchLut(hist,total){
  const h=hist.slice();
  const cut0=Math.floor(total/100);            // 引擎 int(n*1//100)
  let cut=cut0;
  for(let lo=0;lo<256;lo++){
    if(cut>h[lo]){ cut-=h[lo]; h[lo]=0; } else { h[lo]-=cut; cut=0; }
    if(cut<=0) break;
  }
  cut=cut0;
  for(let hi=255;hi>=0;hi--){
    if(cut>h[hi]){ cut-=h[hi]; h[hi]=0; } else { h[hi]-=cut; cut=0; }
    if(cut<=0) break;
  }
  let lo=0;  while(lo<256 && !h[lo]) lo++;
  let hi=255; while(hi>=0 && !h[hi]) hi--;
  const lut=new Uint8Array(256);
  if(hi<=lo){ for(let i=0;i<256;i++) lut[i]=i; return lut; }
  const sc=255.0/(hi-lo), off=-lo*sc;
  for(let i=0;i<256;i++) lut[i]=Math.max(0,Math.min(255,Math.trunc(i*sc+off)));
  return lut;
}

// 引擎 `_dual_knots(tone, off, mul)`：把坡道域 t 的靶钉换算到本支自己的场域。
// 表外档返回 null ⇒ `_duality_map` 原样交回（逐字节回退）。
function dualKnots(toneKey,off,mul){
  const t=DUALITY_TGT[toneKey];
  if(t==null) return null;
  const o=(off==null?0.0:off), m=(mul==null?1.0:mul);
  return [(t[0]-o)/m,(t[1]-o)/m,(t[2]-o)/m];
}

// numpy `np.interp` 同式（升序节点、端点外取端值、重复节点取后一段 ⇒ 退化区间直接跳右值）。
function npInterp(v,x,y){
  if(v<=x[0]) return y[0];
  if(v>=x[4]) return y[4];
  let i=0;
  while(i<3 && x[i+1]<=v) i++;
  const dx=x[i+1]-x[i];
  return dx>0.0 ? y[i]+(y[i+1]-y[i])* ((v-x[i])/dx) : y[i+1];
}

// 引擎 `_duality_map(field, knots, sel, k)`：三个自身分位单调分段线性搬到同档官方靶点。
// 开关 ≤0 / 档不在白名单 / 样本 <64 ⇒ **原样返回**（这是第一趟的默认臂，一格都不动）。
function dualityMap(field,fw,fh,toneKey,sel,k){
  if(k<=0.0) return field;
  const knots=dualKnots(toneKey,0.0,1.0);
  if(knots===null) return field;
  const n=fw*fh, acc=[];
  if(sel===null||sel===undefined){ for(let i=0;i<n;i++) acc.push(field[i]); }
  else for(let i=0;i<n;i++) if(sel[i]) acc.push(field[i]);
  if(acc.length<64) return field;
  const q=[0.0,0.0,0.0];
  for(let j=0;j<3;j++) q[j]=Math.min(1.0,Math.max(0.0,percentile1d(acc,DUALITY_R[j])));
  for(let j=1;j<3;j++) if(q[j]<q[j-1]) q[j]=q[j-1];         // np.maximum.accumulate
  const t=[0.0,0.0,0.0];
  for(let j=0;j<3;j++) t[j]=Math.min(1.0,Math.max(0.0,knots[j]));
  const x=[0.0,q[0],Math.max(q[1],q[0]+1e-3),Math.max(q[2],q[1]+1e-3),1.0];
  const y=[0.0,t[0],Math.max(t[1],t[0]+1e-3),Math.max(t[2],t[1]+1e-3),1.0];
  const out=new Float32Array(n);
  for(let i=0;i<n;i++) out[i]=Math.fround(npInterp(field[i],x,y));
  if(k>=1.0) return out;
  const mix=new Float32Array(n);
  for(let i=0;i<n;i++) mix[i]=Math.fround(field[i]+(out[i]-field[i])*k);
  return mix;
}

// 引擎 `_posterize` 同式：带边由 `bandCuts`（均匀台阶与场自身分位按 QBAND_LAM 插值）给出，
// 落带由 `bandLevel`（searchsorted 口径）给出。这两个原语满铺支已在用，这里只是整场套一遍。
function posterizeField(arr,n){
  const cuts=bandCuts(arr,n), out=new Float64Array(n);
  for(let i=0;i<n;i++) out[i]=bandLevel(Math.min(1,Math.max(0,arr[i])),cuts);
  return out;
}

// 引擎 `_emblem_base(tone)`：EMBLEM_BASE<0 = 用分档表，表外档吃 FLAT 兜底。
function emblemBase(toneKey){
  if(EMBLEM_BASE>=0.0) return EMBLEM_BASE;
  const v=EMBLEM_BASE_T[toneKey];
  return v==null ? EMBLEM_BASE_FLAT : v;
}

// 引擎 `_block_reads(img)` 同口径：成图**中央块** `n = w//2`、方块 `[n//2, n+n//2)²` ∩ `a>128`，
// 灰阶走 PIL `convert("L")` 的整数式（在 RGBA 上 = 丢掉 alpha 直接读 RGB，不做合成）。
// 判病必须量在**成图**上而不是量在现场：场→成图之间隔着落位、坡道、电平锚、浮雕、装饰四层，
// 引擎账（badge_engine.py:745-750）实测两者只有 r=0.663 / 斜率 0.384 ⇒ 拿场判病必错档。
function blockReads(canvas){
  const w=canvas.width, n=Math.floor(w/2), x0=Math.floor(n/2);
  const d=canvas.getContext('2d').getImageData(x0,x0,n,n).data;
  const v=[];
  for(let i=0;i<n*n;i++) if(d[i*4+3]>128) v.push(luma601(d[i*4],d[i*4+1],d[i*4+2]));
  if(v.length<64) return null;
  let dark=0;
  for(let j=0;j<v.length;j++) if(v[j]<DUALITY_DARK_L) dark++;
  return [dark/v.length*100.0, percentile1d(v,95.0)-percentile1d(v,5.0)];
}

// 引擎 `_dual_band_dist` / `_dual_disease`：带内 = 0，带外 = 到最近沿的距离；
// A 过暗剪纸 = dark > 1.3×带上沿，B 太平且偏亮 = dark < 带下沿 且跨度 < 0.85×官方中位跨度。
function dualBandDist(dark,band){
  return (band[0]<=dark&&dark<=band[1]) ? 0.0 : Math.max(band[0]-dark, dark-band[1]);
}
function dualDisease(reads,toneKey){
  const band=DUALITY_GUARD[toneKey];
  if(band==null||reads===null) return false;
  return reads[0]>1.3*band[1] || (reads[0]<band[0] && reads[1]<0.85*band[2]);
}

// 引擎 `generate()` 的两趟闸门 + `_dual_gate`：第一趟**强制关支**（k=0）拿默认臂成图去量，
// 健康格就此原样交回、一趟不多花；病格才花第二趟（k=DUALITY_K），且只有省下
// `max(DUALITY_GAIN_MIN, 10%×原距离)` 才换图。换图与否都以 **stage 上最终那张**为准 ⇒
// 判负时必须用第一趟**重合成一次**，这样"闸门不开的格子成图逐字节 = 单趟"才是机制不是措辞。
// `compose(f)` 由调用方给（引擎那里是 `compose_endfield`，网页侧合成目标恒为 `stage`）。
function dualGate(toneKey,faceFirst,render,compose){
  const band=DUALITY_GUARD[toneKey];
  const r0=blockReads(stage);
  if(r0===null) return {face:faceFirst,msg:'keep=off reads=None'};
  if(!dualDisease(r0,toneKey))
    return {face:faceFirst,msg:'keep=off dark='+r0[0].toFixed(2)+' spread='+r0[1].toFixed(1)+' disease=no'};
  const f2=render(DUALITY_K);
  compose(f2);
  const r1=blockReads(stage);
  const head='dark='+r0[0].toFixed(2)+'/'+r0[1].toFixed(1)+' disease=yes ';
  if(r1===null){ compose(faceFirst); return {face:faceFirst,msg:'keep=off '+head+'second=None'}; }
  const d0=dualBandDist(r0[0],band), d1=dualBandDist(r1[0],band);
  const need=d0-Math.max(DUALITY_GAIN_MIN,0.10*d0);
  const sec='second='+r1[0].toFixed(2)+'/'+r1[1].toFixed(1)+' gain '+(d0-d1).toFixed(2);
  if(d1>need){ compose(faceFirst); return {face:faceFirst,msg:'keep=off '+head+sec+'<'+(d0-need).toFixed(2)}; }
  return {face:f2,msg:'keep=dual '+head+sec+'>='+(d0-need).toFixed(2)};
}

// 引擎 `etch_face(..., mode="silhouette")` 的整条电平链（badge_engine.py:1191-1255 + 1294-1313
// + 1370-1372 + 1375-1393）。入参 `cut` = **已裁已缩**的主体图（与 `fallbackRelief` 同口径），
// 这样对比时两侧吃同一张位图、同一张掩膜，将"裁剪与重采样是两台仪器"这条口径差挡在门外。
// 返回 {face, t, amin}：`t` 只给数值对比用，生产路径只取 `face`。
function silhouetteFace(cut,toneKey,ls,dt,dualityK){
  const fw=cut.width, fh=cut.height, n=fw*fh;
  const cd=cut.getContext('2d').getImageData(0,0,fw,fh).data;
  // `_gray_arr` = alpha_composite 到 128 灰底再 convert("L")；`g8 = (g*255).astype(uint8)`
  // 因而是原样的整数灰阶（float32 v/255*255 的往返在本机探针上 256 级全部精确还原）。
  const g8=new Uint8Array(n), av=new Float32Array(n), g=new Float32Array(n);
  for(let i=0;i<n;i++){
    const a=cd[i*4+3], af=a/255.0;
    g8[i]=luma601(Math.round(cd[i*4]*af+128*(1-af)),
                  Math.round(cd[i*4+1]*af+128*(1-af)),
                  Math.round(cd[i*4+2]*af+128*(1-af)));
    av[i]=a/255.0; g[i]=g8[i]/255.0;
  }
  // 本支的 `edges` = **未混合**那份（引擎的 line 支在 :1283 就地重赋值混进细边缘，剪影支不走那里）。
  // 满铺开火后引擎也吃这一份 ⇒ 下面 `fallbackRelief` 传的必须是它，不是 line 支的混合值。
  const sigma=Math.max(0.5,1.1/Math.max(dt,0.05));
  const g1=blurLuma(g,fw,fh,sigma), g2=blurLuma(g,fw,fh,sigma*1.9);
  const edgeU=new Float32Array(n);
  let emax=1e-5;
  for(let i=0;i<n;i++){ const e=Math.abs(g1[i]-g2[i]); edgeU[i]=e; if(e>emax) emax=e; }
  for(let i=0;i<n;i++) edgeU[i]=Math.min(1,Math.max(0,edgeU[i]/(emax*0.55)));
  const lsx=Math.min(1.8,Math.max(0.3,ls));
  const fillT=(SILO_FILL[toneKey]==null ? SILO_FILL_DEFAULT : SILO_FILL[toneKey]);
  const hist=new Array(256).fill(0), selAv=new Uint8Array(n);
  let cnt=0;
  for(let i=0;i<n;i++) if(av[i]>0.5){ selAv[i]=1; hist[g8[i]]++; cnt++; }
  const lut=stretchLut(hist,cnt);
  const ga=new Float32Array(n);
  for(let i=0;i<n;i++) ga[i]=lut[g8[i]]/255.0;
  const solid=blurLuma(av,fw,fh,2.0);
  const bgT=Math.max(0.10,fillT-0.42);
  const edgeT=new Float32Array(n);
  for(let i=0;i<n;i++) edgeT[i]=edgeU[i]*(0.16+FACE_INK)*lsx;
  const sm=(FACE_SMOOTH>0.0 ? blurLuma(ga,fw,fh,FACE_SMOOTH) : ga);
  const cont=dualityMap(sm,fw,fh,toneKey,selAv,dualityK);
  const field=posterizeField(cont,n);
  const inner=new Float64Array(n);
  for(let i=0;i<n;i++) inner[i]=Math.min(1,Math.max(0,field[i]+edgeT[i]));
  let engSrc=null, lamp=null;
  if(EMBLEM_GAIN>0.0 && EMBLEM_TONES.indexOf(toneKey)>=0 && engraveOn(toneKey)){
    engSrc=new Float32Array(n);
    for(let i=0;i<n;i++) engSrc[i]=Math.min(1,Math.max(0,inner[i]));   // 压平**前**的照片场
    const b=emblemBase(toneKey);
    const selS=new Uint8Array(n);
    if(LINESTOP>0.0||EDGE_GATE>0.0){
      for(let i=0;i<n;i++) selS[i]=(solid[i]>0.45?1:0);
      const amp=linestopAmp(cont,fw,fh,LINESTOP,LINESTOP_WIN,LINESTOP_Q,LINESTOP_FLOOR,selS);
      lamp=new Float32Array(n);
      for(let i=0;i<n;i++) lamp[i]=selS[i]?amp[i]:1.0;                 // 主体外恒 1.0
    }
    if(EDGE_GATE>0.0&&lamp) for(let i=0;i<n;i++) edgeT[i]*=Math.pow(lamp[i],EDGE_GATE);
    for(let i=0;i<n;i++) inner[i]=Math.min(1,Math.max(0,b+(field[i]-b)*EMBLEM_HOLD+edgeT[i]));
  }
  const t=new Float32Array(n);
  for(let i=0;i<n;i++) t[i]=(solid[i]>0.45 ? inner[i] : bgT);
  if(engSrc) for(let i=0;i<n;i++) if(solid[i]<=0.45) engSrc[i]=t[i];   // 主体外用当前场
  for(let i=0;i<n;i++) t[i]=Math.min(1,Math.max(0,t[i]));
  const pal=PALETTES[toneKey];
  const hiC=plateTop(pal,toneKey);                                       // relief_ramp ⇒ 顶端吃 _plate_top
  const loC=[pal[0][0]*0.62,pal[0][1]*0.62,pal[0][2]*0.62];
  const fa=blurBytes(av,fw,fh,0.5);
  let amin=255;
  for(let i=0;i<n;i++) if(fa[i]<amin) amin=fa[i];
  // WD-2 只读旁路：把中间场随返回值一起交出（只是多带几个已有引用，不参与任何电平算术）。
  // `sm` = 分带前那张平滑场：WD-2e 接力档把**引擎那份** `sm` 喂回这里，只走
  // `dualityMap`+`posterizeField` 两段纯算术 ⇒ 高斯/画布两台仪器全部出局，差值只能来自链条本身。
  const dbg={g8:g8,av:av,ga:ga,solid:solid,edgeU:edgeU,cont:cont,field:field,inner:inner,bgT:bgT,sm:sm};
  const out=document.createElement('canvas'); out.width=fw; out.height=fh;
  const oc=out.getContext('2d'); const od=oc.createImageData(fw,fh);
  if(amin>200){
    fallbackRelief(cut,out,toneKey,fw,fh,edgeU);
    return {face:out,t:t,amin:amin,dbg:dbg};
  }
  const rgbF=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const b3=i*3;
    for(let k=0;k<3;k++) rgbF[b3+k]=loC[k]+(hiC[k]-loC[k])*t[i]; }       // 暗金属→亮金属直连坡道
  const sh=embossSilo(t,fw,fh,EMBOSS_STRENGTH_SILO);
  if(sh) for(let i=0;i<n;i++){
    const s=sh[i], ph=s>0?s:0, nl=s<0?-s:0, b3=i*3;
    for(let k=0;k<3;k++){ const v=rgbF[b3+k];
      rgbF[b3+k]=v+(hiC[k]-v)*ph*EMBOSS_HI+(loC[k]-v)*nl*EMBOSS_LO; }
  }
  if(engraveOn(toneKey)){
    if(engSrc) engraveShade(rgbF,engSrc,edgeU,fw,fh,lamp,null,LA_MIX,EMBLEM_GAIN,EMBLEM_PERIOD);
    else engraveShade(rgbF,t,edgeU,fw,fh,null,null,LA_MIX,null,null);
  }
  // 引擎末尾 `np.clip(rgb,0,255).astype(np.uint8)` 是**截断**，Uint8ClampedArray 却四舍五入
  // ⇒ 必须 Math.trunc，否则每格可能差 1 灰阶而量测查不出原因。
  // `rgbF` 是紧凑的 n×3 缓冲（下标走 b3），`od.data` 是 RGBA 的 n×4 缓冲（下标走 b4）⇒
  // 两套步长绝不能共用一个变量：曾把 `b3` 同时喂给 `od.data`，像素流每格错一位，
  // 对比账上留下 `rgb_max=224 / alpha_maxdiff=245` 而 t/field/cont 三段仍然逐位相同。
  for(let i=0;i<n;i++){ const b3=i*3, b4=i*4;
    for(let k=0;k<3;k++) od.data[b4+k]=Math.trunc(Math.max(0,Math.min(255,rgbF[b3+k])));
    od.data[b4+3]=fa[i]; }
  oc.putImageData(od,0,0);
  return {face:out,t:t,amin:amin,dbg:dbg};
}

// 生产入口：与 `etchFace` 同一套「按 alpha 外接框裁 3% 边、再等比缩到 facePx」的前处理。
// 这里**刻意复制**那几行而不去抽公共helper —— `etchFace` 的字节是 `SILO_ROUTE=0` 的逐字节回退面，
// 也是既有同步钉子的靶子，动它 = 把回退口径一起动掉。
function etchSilhouette(srcCanvas,toneKey,ls,dt,facePx,dualityK){
  const srcW=srcCanvas.width, srcH=srcCanvas.height;
  const sd=srcCanvas.getContext('2d').getImageData(0,0,srcW,srcH).data;
  let minX=1e9,minY=1e9,maxX=-1,maxY=-1;
  for(let y=0;y<srcH;y++)for(let x=0;x<srcW;x++)
    if(sd[(y*srcW+x)*4+3]>24){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  if(maxX<0){minX=0;minY=0;maxX=srcW-1;maxY=srcH-1;}
  const pw=Math.round((maxX-minX)*0.03), ph=Math.round((maxY-minY)*0.03);
  minX=Math.max(0,minX-pw); minY=Math.max(0,minY-ph);
  maxX=Math.min(srcW-1,maxX+pw); maxY=Math.min(srcH-1,maxY+ph);
  const cw=maxX-minX+1, chh=maxY-minY+1;
  const ratio=facePx/Math.max(cw,chh);
  const fw=Math.max(1,Math.round(cw*ratio)), fh=Math.max(1,Math.round(chh*ratio));
  const cut=document.createElement('canvas'); cut.width=fw; cut.height=fh;
  cut.getContext('2d').drawImage(srcCanvas,minX,minY,cw,chh,0,0,fw,fh);
  return silhouetteFace(cut,toneKey,ls,dt,dualityK);
}

function etchFace(srcCanvas,toneKey,ls,dt,facePx){
  const srcW=srcCanvas.width, srcH=srcCanvas.height;
  const sd=srcCanvas.getContext('2d').getImageData(0,0,srcW,srcH).data;
  let minX=1e9,minY=1e9,maxX=-1,maxY=-1;
  for(let y=0;y<srcH;y++)for(let x=0;x<srcW;x++)
    if(sd[(y*srcW+x)*4+3]>24){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  if(maxX<0){minX=0;minY=0;maxX=srcW-1;maxY=srcH-1;}
  const pw=Math.round((maxX-minX)*0.03), ph=Math.round((maxY-minY)*0.03);
  minX=Math.max(0,minX-pw); minY=Math.max(0,minY-ph);
  maxX=Math.min(srcW-1,maxX+pw); maxY=Math.min(srcH-1,maxY+ph);
  const cw=maxX-minX+1, chh=maxY-minY+1;
  const ratio=facePx/Math.max(cw,chh);
  const fw=Math.max(1,Math.round(cw*ratio)), fh=Math.max(1,Math.round(chh*ratio));
  const cut=document.createElement('canvas'); cut.width=fw; cut.height=fh;
  cut.getContext('2d').drawImage(srcCanvas,minX,minY,cw,chh,0,0,fw,fh);
  const flat=grayFlat(cut);
  const g=new Float32Array(fw*fh);
  for(let i=0;i<fw*fh;i++)g[i]=(flat.data[i*4]*0.299+flat.data[i*4+1]*0.587+flat.data[i*4+2]*0.114)/255;
  const sigma=Math.max(0.5,1.1/Math.max(dt,0.05));
  const g1=blurLuma(g,fw,fh,sigma), g2=blurLuma(g,fw,fh,sigma*1.9);
  const gb=blurLuma(g,fw,fh,5), g6=blurLuma(g,fw,fh,6);
  const sFine=Math.max(0.4,sigma*0.55);
  const f1=blurLuma(g,fw,fh,sFine), f2=blurLuma(g,fw,fh,sFine*1.8);
  let efMax=1e-6;
  const ef=new Float32Array(fw*fh);
  for(let i=0;i<fw*fh;i++){ef[i]=Math.abs(f1[i]-f2[i]);if(ef[i]>efMax)efMax=ef[i];}
  let emax=1e-6;
  const eBase=new Float32Array(fw*fh);
  for(let i=0;i<fw*fh;i++){eBase[i]=Math.abs(g1[i]-g2[i]);if(eBase[i]>emax)emax=eBase[i];}
  const period=Math.max(7,12/Math.max(dt,0.05)), ang=32*Math.PI/180;
  const pal=PALETTES[toneKey];
  const out=document.createElement('canvas'); out.width=fw; out.height=fh;
  const oc=out.getContext('2d'); const od=oc.createImageData(fw,fh);
  const ad=cut.getContext('2d').getImageData(0,0,fw,fh).data;
  const lsx=Math.min(1.8,Math.max(0.3,ls));
  const n2=fw*fh;
  const tf=new Float32Array(n2), edgeArr=new Float32Array(n2);
  for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){
    const i=y*fw+x;
    // 顶部 edges（eBase/(emax*0.55)）只进混合式：引擎在 line 支把 `edges` 就地重赋值，
    // 铺满支也在其后才取 ⇒ 两支纹理吃的都是这份混合值。
    const e=Math.min(1,Math.max(0,eBase[i]/(emax*0.55)*0.55+ef[i]/efMax*0.45));
    edgeArr[i]=e;                                               // line 支混合后的 edges —— 两支纹理都吃这份
    const local=Math.min(1,Math.max(0,(g[i]-g6[i])*1.6+0.5));
    const tn=1-gb[i];
    const s=x*Math.sin(ang)+y*Math.cos(ang);
    const fr=Math.abs(((s/period)%1)-0.5)*2;
    const ht=Math.min(1,Math.max(0,1-fr*1.5));
    let hatch=ht*Math.min(1,Math.max(0,tn*1.3-0.4))*0.22;
    hatch*=1-Math.min(1,e)*0.75;
    let t=0.30+(1-local)*0.26+e*0.62*lsx+hatch*0.6*lsx;
    tf[i]=Math.max(0,Math.min(1,t));
  }
  const rgbBase=new Float32Array(n2*3);
  let amin=255, lmin=1e9, lmax=-1e9;
  for(let i=0;i<n2;i++){
    const t=tf[i];
    let r,gg,b2;
    if(t<0.5){const u=t*2;r=pal[0][0]+(pal[1][0]-pal[0][0])*u;gg=pal[0][1]+(pal[1][1]-pal[0][1])*u;b2=pal[0][2]+(pal[1][2]-pal[0][2])*u;}
    else{const u=t*2-1;r=pal[1][0]+(pal[2][0]-pal[1][0])*u;gg=pal[1][1]+(pal[2][1]-pal[1][1])*u;b2=pal[1][2]+(pal[2][2]-pal[1][2])*u;}
    rgbBase[i*3]=r; rgbBase[i*3+1]=gg; rgbBase[i*3+2]=b2;
    const lm=0.299*r+0.587*gg+0.114*b2; if(lm<lmin)lmin=lm; if(lm>lmax)lmax=lm;
    const a=ad[i*4+3]; if(a<amin)amin=a;
    od.data[i*4+3]=a;
  }
  // line 主干也上方向浮雕：与引擎 etch_face 的 else 支同式（棱只落在电平台界上）。
  // 漏了这一步不会报错，只是章面「不凸」——这正是「引擎绿、网页还是一坨」的那类静默错档。
  const fullBleed=amin>200&&(lmax-lmin)>=FALLBACK_POLISH_SPAN_MIN;
  const loC=[pal[0][0]*0.62,pal[0][1]*0.62,pal[0][2]*0.62];
  if(!fullBleed){
    const sh=embossField(tf,fw,fh,EMBOSS_STRENGTH_LINE);
    const hiL=pal[2], rgbF=new Float32Array(n2*3);
    for(let i=0;i<n2;i++){
      const s2=sh[i], ph=s2>0?s2:0, nl=s2<0?-s2:0, b3=i*3;
      for(let k=0;k<3;k++){
        const v=rgbBase[b3+k];
        rgbF[b3+k]=v+(hiL[k]-v)*ph*EMBOSS_HI+(loC[k]-v)*nl*EMBOSS_LO;
      }
    }
    if(engraveOn(toneKey)) engraveShade(rgbF,tf,edgeArr,fw,fh);
    for(let i=0;i<n2;i++)for(let k=0;k<3;k++) od.data[i*4+k]=Math.max(0,Math.min(255,rgbF[i*3+k]));
  }
  oc.putImageData(od,0,0);
  if(fullBleed) fallbackRelief(cut,out,toneKey,fw,fh,edgeArr);
  return out;
}

/* ---------------- 几何与文字 ---------------- */
function hexPts(cx,cy,r,rotDeg=0){
  const pts=[];
  for(let i=0;i<6;i++){
    const a=(rotDeg+i*60-90)*Math.PI/180;
    pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);
  }
  return pts;
}
function hexPath(ctx,cx,cy,r,rotDeg=0){
  const p=hexPts(cx,cy,r,rotDeg);
  ctx.beginPath();
  ctx.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<6;i++)ctx.lineTo(p[i][0],p[i][1]);
  ctx.closePath();
}
function polyPath(ctx,pts){
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
  ctx.closePath();
}
function roundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawStar(ctx,cx,cy,r,fill){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2===0?r:r*0.45;
    const a=(-90+i*36)*Math.PI/180;
    const X=cx+rr*Math.cos(a),Y=cy+rr*Math.sin(a);
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function drawHeart(ctx,hx,hy,s,col){
  const lobe=s*0.62;
  ctx.fillStyle=col;
  ctx.beginPath();
  ctx.ellipse(hx-(s*0.92-lobe),hy-s*0.55,lobe,lobe,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(hx+(s*0.92-lobe),hy-s*0.55,lobe,lobe,0,0,Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(hx-s*0.95,hy-s*0.02);
  ctx.lineTo(hx+s*0.95,hy-s*0.02);
  ctx.lineTo(hx,hy+s*0.85);
  ctx.closePath();
  ctx.fill();
}
function labelW(ctx,text,tracking=0){
  let w=0; const ch=[...text];
  for(const c of ch)w+=ctx.measureText(c).width;
  return w+tracking*Math.max(0,ch.length-1);
}
function trackedText(ctx,text,cx,y,fill,tracking=4,shadow=null){
  ctx.textAlign='left'; ctx.textBaseline='middle';
  const ch=[...text];
  const widths=ch.map(c=>ctx.measureText(c).width);
  const total=widths.reduce((a,b)=>a+b,0)+tracking*Math.max(0,ch.length-1);
  let x0=cx-total/2;
  for(let i=0;i<ch.length;i++){
    if(shadow){ctx.fillStyle=shadow;ctx.fillText(ch[i],x0+2,y+2);}
    ctx.fillStyle=fill;ctx.fillText(ch[i],x0,y);
    x0+=widths[i]+tracking;
  }
}

const FONT_EN='"Bahnschrift","Arial Black","Microsoft YaHei",sans-serif';
const FONT_CN='"Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_ROUND_CN='"YouYuan","幼圆","Microsoft YaHei",sans-serif';
const FONT_ROUND_EN='"Arial Rounded MT Bold","Bahnschrift","Microsoft YaHei",sans-serif';
const MONO='"Consolas","Courier New",monospace';

/* ---------------- 镀膜 / 质感图层 ---------------- */
function spectralFilm(W,H,thetaDeg,alpha,satBoost=1.0){
  // 全息光谱镀膜（橙→黄绿→青绿→蓝紫→粉）：stops 为 RGB 色值（引擎直接 RGB×255×sat），整面渐变后整体旋转
  const stops=[[0.96,0.55,0.10],[0.16,0.78,0.22],[0.15,0.85,0.80],
               [0.42,0.34,0.92],[0.94,0.30,0.56],[0.96,0.55,0.10]];
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.translate(W/2,H/2);
  x.rotate(-thetaDeg*Math.PI/180);
  const g=x.createLinearGradient(-W/2,0,W/2,0);
  for(let i=0;i<stops.length;i++){
    const col=stops[i].map(ch=>Math.min(255,ch*255*satBoost));
    g.addColorStop(i/(stops.length-1),rgb(col));
  }
  x.fillStyle=g;
  x.fillRect(-W/2,-H/2,W,H);
  x.setTransform(1,0,0,1,0,0);
  const id=x.getImageData(0,0,W,H); const d=id.data;
  for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){
    const m=Math.pow(Math.sin(xx/W*Math.PI*2.4+y/H*Math.PI)*0.5+0.5,1.15)*0.45+0.55;
    d[(y*W+xx)*4+3]=Math.min(255,Math.round(alpha*m));
  }
  x.putImageData(id,0,0);
  return c;
}
function iridescentOverlay(W,H,alpha,maskCanvas){
  // 镀层随形虹彩：只在轮廓缘与环带附着（7 循环 HSV 渐变，旋转 24°）
  const stops=[[0.53,0.83,0.89],[0.83,0.48,0.78],[0.39,0.72,0.65],
               [0.93,0.93,0.95],[0.53,0.83,0.89]];
  const row=document.createElement('canvas'); row.width=W; row.height=1;
  const rx=row.getContext('2d');
  const im=rx.createImageData(W,1);
  for(let x=0;x<W;x++){
    const t=(x/Math.max(W-1,1))*7%1;
    const seg=t*(stops.length-1);
    const si=Math.min(stops.length-2,Math.floor(seg));
    const tt=seg-si;
    const c0=hsv2rgb(stops[si][0],stops[si][1],stops[si][2]).map(v=>Math.min(255,v*1.15));
    const c1=hsv2rgb(stops[si+1][0],stops[si+1][1],stops[si+1][2]).map(v=>Math.min(255,v*1.15));
    im.data[x*4]  =c0[0]+(c1[0]-c0[0])*tt;
    im.data[x*4+1]=c0[1]+(c1[1]-c0[1])*tt;
    im.data[x*4+2]=c0[2]+(c1[2]-c0[2])*tt;
    im.data[x*4+3]=255;
  }
  rx.putImageData(im,0,0);
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  x.translate(W/2,H/2);
  x.rotate(-24*Math.PI/180);
  x.drawImage(row,-W/2,-H/2,W,H);
  x.setTransform(1,0,0,1,0,0);
  const m=document.createElement('canvas'); m.width=W; m.height=H;
  const mx=m.getContext('2d');
  mx.drawImage(maskCanvas,0,0);
  const md=mx.getImageData(0,0,W,H).data;
  const id=x.getImageData(0,0,W,H);
  for(let i=0;i<W*H;i++)id.data[i*4+3]=Math.min(255,Math.round(md[i*4]/255*alpha));
  x.putImageData(id,0,0);
  return c;
}
function faceOutline(face,color,gain){
  // 轮廓缘 alpha（模糊外扩 - 原 alpha）→ 落刀描边
  const w=face.width, h=face.height;
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  const tc=tmp.getContext('2d');
  tc.drawImage(face,0,0);
  const base=tc.getImageData(0,0,w,h).data;
  const grow=document.createElement('canvas'); grow.width=w; grow.height=h;
  const gc=grow.getContext('2d');
  gc.filter='blur(1px)';
  gc.drawImage(tmp,0,0);
  gc.filter='none';
  const g2=document.createElement('canvas'); g2.width=w; g2.height=h;
  const g2c=g2.getContext('2d');
  for(const[ox,oy]of[[-2,0],[2,0],[0,-2],[0,2],[-1,-1],[1,1],[-1,1],[1,-1]])g2c.drawImage(grow,ox,oy);
  g2c.globalCompositeOperation='destination-in';
  g2c.drawImage(grow,0,0);
  g2c.globalCompositeOperation='source-over';
  const gd=g2c.getImageData(0,0,w,h);
  for(let i=0;i<gd.data.length;i+=4){
    const a=Math.min(220,Math.max(0,gd.data[i+3]-base[i+3])*gain);
    if(a>10){
      gd.data[i]=color[0]; gd.data[i+1]=color[1]; gd.data[i+2]=color[2]; gd.data[i+3]=a;
    }else gd.data[i+3]=0;
  }
  g2c.putImageData(gd,0,0);
  return g2;
}
function brushedStreaks(W,H,thetaDeg,count,alpha,seed,width=1,darkRatio=0.45){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d');
  const rng=mulberry32(seed);
  const th=thetaDeg*Math.PI/180;
  const dx=Math.cos(th), dy=Math.sin(th), px=-dy, py=dx;
  x.lineWidth=width;
  for(let i=0;i<count;i++){
    const sx=rng()*W, sy=rng()*H;
    const ln=50+rng()*140;
    const off=rng()*12-6;
    const shade=rng()<(1.0-darkRatio)?255:0;
    const a=(alpha*(0.5+rng()*0.5))/255;
    x.strokeStyle=`rgba(${shade},${shade},${shade},${a.toFixed(3)})`;
    x.beginPath();
    x.moveTo(sx+px*off,sy+py*off);
    x.lineTo(sx+dx*ln+px*off,sy+dy*ln+py*off);
    x.stroke();
  }
  const b=document.createElement('canvas'); b.width=W; b.height=H;
  const bx=b.getContext('2d');
  bx.filter='blur(0.6px)';
  bx.drawImage(c,0,0);
  return b;
}

/* ---------------- 明日方舟模板（对齐引擎 v16） ---------------- */
function composeArknights(canvas, face, text, subtitle, serial, number, tone) {
  const CW=1000, CH=1150, cx=CW/2, cy=560, R=500;
  canvas.width=CW; canvas.height=CH;
  const ctx=canvas.getContext('2d');
  const apothem=R*Math.sqrt(3)/2;
  let line_hi,line_mid,line_lo,outline_c;
  if(tone==='gold'){line_hi=[239,228,192];line_mid=[201,162,79];line_lo=[138,106,47];outline_c=[32,27,20];}
  else if(tone==='steel'){line_hi=[96,104,112];line_mid=[66,74,82];line_lo=[40,47,54];outline_c=[40,47,54];}
  else if(tone==='stamp'){line_hi=[226,108,72];line_mid=[178,62,36];line_lo=[118,32,18];outline_c=[118,32,18];}
  else if(tone==='plated'){line_hi=[240,245,247];line_mid=[174,190,199];line_lo=[96,110,122];outline_c=[28,33,40];}
  else{line_hi=[232,238,240];line_mid=[169,179,187];line_lo=[96,108,120];outline_c=[43,50,58];}
  const fld=FIELDS[tone]||FIELD_CREAM;

  // 底场：垂直轻微变浅的哑光单色
  ctx.save(); hexPath(ctx,cx,cy,R); ctx.clip();
  const g=ctx.createLinearGradient(0,cy-R,0,cy+R);
  g.addColorStop(0,rgb(fld[0])); g.addColorStop(1,rgb(fld[1]));
  ctx.fillStyle=g; ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  // 多层同心细线套环（PIL 描边绘于多边形内侧：环带=[r-wd, r]，暗影偏移 + 主环 + 上左高光）
  const rings=[[R-4,3,line_hi],[R-26,2,line_mid],[R-44,2,line_mid],[R-60,2,line_lo]];
  for(const[r,wd,col]of rings){
    const sh=col.map(v=>Math.round(v*0.45));
    const hi=col.map(v=>Math.min(255,Math.round(v*1.35)));
    hexPath(ctx,cx+2,cy+3,r-wd/2); ctx.strokeStyle=rgba(sh,0.667); ctx.lineWidth=wd; ctx.stroke();
    hexPath(ctx,cx,cy,r-wd/2);     ctx.strokeStyle=rgb(col);      ctx.lineWidth=wd; ctx.stroke();
    hexPath(ctx,cx-2,cy-2,r-wd/2); ctx.strokeStyle=rgba(hi,0.588); ctx.lineWidth=wd; ctx.stroke();
  }
  if(tone==='gold'){
    const rs=R-112;
    hexPath(ctx,cx,cy,rs-1); ctx.strokeStyle=rgba(line_mid,0.784); ctx.lineWidth=2; ctx.stroke();
    for(let i=0;i<14;i++){
      const a=(-90+i*(360/14))*Math.PI/180;
      drawStar(ctx,cx+rs*Math.cos(a),cy+rs*Math.sin(a),9,rgba(line_hi,0.941));
    }
  }

  // 放射细线密纹
  const rayC=tone==='stamp' ? rgba([160,90,60],0.157)
    : tone==='gold' ? 'rgba(186,146,68,0.549)' : rgba(line_lo,0.431);
  ctx.strokeStyle=rayC; ctx.lineWidth=4;
  for(let i=0;i<72;i++){
    const a=i*5*Math.PI/180;
    const r1=i%2===0?apothem-20:apothem-84;
    ctx.beginPath();
    ctx.moveTo(cx+92*Math.cos(a),cy-10+92*Math.sin(a));
    ctx.lineTo(cx+r1*Math.cos(a),cy-10+r1*Math.sin(a));
    ctx.stroke();
  }

  // 网点两层（暗纱 + 亮网点对偶）
  ctx.save(); hexPath(ctx,cx,cy,R); ctx.clip();
  const darkCol=tone==='stamp' ? [120,90,60] : (tone==='gold'?[120,100,62]:[16,19,24]);
  ctx.fillStyle=rgba(darkCol,tone==='gold'?0.306:0.275);
  ctx.fillRect(0,0,CW,CH);
  const lightCol=tone==='gold'?[255,246,220]:[226,232,238];
  ctx.fillStyle=rgba(lightCol,0.118);
  for(let y=2;y<CH;y+=4)for(let x=2;x<CW;x+=4)ctx.fillRect(x,y,2,2);
  ctx.fillStyle=rgba(lightCol,0.157);
  for(let y=0;y<CH;y+=4)for(let x=0;x<CW;x+=4)ctx.fillRect(x,y,2,2);
  ctx.restore();

  // 边缘暗角（金属冲压深度）
  ctx.save(); hexPath(ctx,cx,cy,R); ctx.clip();
  const vg=ctx.createRadialGradient(cx,cy,apothem*0.5,cx,cy,apothem);
  vg.addColorStop(0,'rgba(10,13,18,0)');
  vg.addColorStop(1,'rgba(10,13,18,0.235)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  // 细颗粒（哑光金属微噪）
  applyGrain(canvas,13,3);

  // 极轻冷蓝偏光
  const sheenC=document.createElement('canvas'); sheenC.width=CW; sheenC.height=CH;
  const sx2=sheenC.getContext('2d');
  sx2.strokeStyle='rgba(205,222,240,0.047)'; sx2.lineWidth=60;
  for(let i=-CW;i<CW;i+=260){sx2.beginPath();sx2.moveTo(i,CH);sx2.lineTo(i+CH,0);sx2.stroke();}
  const sheenB=document.createElement('canvas'); sheenB.width=CW; sheenB.height=CH;
  const sbx=sheenB.getContext('2d');
  sbx.filter='blur(26px)';
  sbx.drawImage(sheenC,0,0);
  ctx.save(); hexPath(ctx,cx,cy,R); ctx.clip();
  ctx.drawImage(sheenB,0,0);
  ctx.restore();

  // 中央纹章
  const fr=Math.min(650/Math.max(face.width,face.height),1);
  const fw=Math.max(1,Math.round(face.width*fr)), fh=Math.max(1,Math.round(face.height*fr));
  const f2=document.createElement('canvas'); f2.width=fw; f2.height=fh;
  f2.getContext('2d').drawImage(face,0,0,fw,fh);
  const fx0=Math.round(cx-fw/2), fy0=Math.round(cy-fh/2-40);
  if(minAlpha(f2)>200){
    // 整图回退：场色垫板
    const fldT=tone==='gold'?'gold':tone==='plated'?'plated':tone==='stamp'?'stamp':'silver';
    const fc=FIELDS[fldT]||FIELD_CREAM;
    const fldMid=[Math.round((fc[0][0]+fc[1][0])/2),Math.round((fc[0][1]+fc[1][1])/2),Math.round((fc[0][2]+fc[1][2])/2)];
    const pad=10, rad=Math.max(28,Math.round(Math.min(fw,fh)*0.10));
    roundedRect(ctx,fx0-pad,fy0-pad,fw+pad*2,fh+pad*2,rad);
    ctx.fillStyle=rgb(fldMid); ctx.fill();
  }
  const outlineCol=tone==='gold'?[104,76,30]:[38,45,53];
  ctx.drawImage(faceOutline(f2,outlineCol,1.7),fx0,fy0);
  ctx.drawImage(f2,fx0,fy0);

  if(tone==='plated'){
    // 虹彩只附着于：主体轮廓缘 + 边框环带
    const mask=document.createElement('canvas'); mask.width=CW; mask.height=CH;
    const mx=mask.getContext('2d');
    mx.strokeStyle='#fff'; mx.lineWidth=30;
    hexPath(mx,cx,cy,R-23); mx.stroke();
    mx.globalCompositeOperation='lighter';
    mx.drawImage(faceOutline(f2,[255,255,255],2.6),fx0,fy0);
    ctx.save(); hexPath(ctx,cx,cy,R); ctx.clip();
    ctx.drawImage(iridescentOverlay(CW,CH,110,mask),0,0);
    ctx.restore();
  }

  // 重画最外圈描边保证边缘锐利（内侧带=[R-3,R]）
  hexPath(ctx,cx,cy,R-1.5); ctx.strokeStyle=rgb(line_hi); ctx.lineWidth=3; ctx.stroke();

  // 嵌入式文字
  let txtCol,tagCol,bandBg,bandBd,topBg;
  if(tone==='gold'){
    txtCol='rgb(96,72,28)'; tagCol=rgba([140,106,44],0.941);
    bandBg='rgba(255,250,236,0.667)'; bandBd=rgba(line_mid,0.902); topBg='rgba(250,244,226,0.588)';
  }else if(tone==='stamp'){
    txtCol='rgb(150,48,26)'; tagCol=rgba([178,62,36],0.941);
    bandBg='rgba(255,252,246,0.647)'; bandBd=rgba(line_mid,0.902); topBg='rgba(250,244,234,0.588)';
  }else{
    txtCol=rgb(line_hi); tagCol=rgba(line_hi,0.922);
    bandBg=tone==='plated'?'rgba(56,66,76,0.784)':'rgba(52,62,72,0.784)';
    bandBd=rgba(line_mid,0.863); topBg='rgba(46,55,64,0.667)';
  }

  // 底部缎带字带（端部收角 + 双细线 + 菱形分隔 + 压印阴影）
  const hw=d=>{const dd0=Math.abs(d);return dd0>=R?0:(R-dd0)/R*apothem;};
  const bw=Math.min(Math.floor(hw(292)*2*0.92),500);
  const bh=84, by=cy+292-bh/2, notch=22;
  const bandPts=[[cx-bw/2+notch,by],[cx+bw/2-notch,by],[cx+bw/2,by+bh/2],
                 [cx+bw/2-notch,by+bh],[cx-bw/2+notch,by+bh],[cx-bw/2,by+bh/2]];
  polyPath(ctx,bandPts.map(p=>[p[0]+3,p[1]+4]));
  ctx.fillStyle=tone==='gold'?'rgba(110,80,30,0.431)':'rgba(8,10,14,0.471)';
  ctx.fill();
  polyPath(ctx,bandPts);
  ctx.fillStyle=bandBg; ctx.fill();
  ctx.strokeStyle=bandBd; ctx.lineWidth=3; ctx.stroke();
  ctx.strokeStyle=rgba(line_mid,0.588); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx-bw/2+notch+12,by+12); ctx.lineTo(cx+bw/2-notch-12,by+12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-bw/2+notch+12,by+bh-12); ctx.lineTo(cx+bw/2-notch-12,by+bh-12); ctx.stroke();
  ctx.fillStyle=rgba(line_mid,0.784);
  for(const dx2 of[-bw/2+notch+3,bw/2-notch-3]){
    ctx.beginPath();
    ctx.moveTo(cx+dx2,by+bh/2-7); ctx.lineTo(cx+dx2+7,by+bh/2);
    ctx.lineTo(cx+dx2,by+bh/2+7); ctx.lineTo(cx+dx2-7,by+bh/2);
    ctx.closePath(); ctx.fill();
  }
  let label=number?`${text} · ${number}`:text;
  const isEN=[...label].every(c=>c.charCodeAt(0)<128);
  ctx.font=isEN?`50px ${FONT_EN}`:`bold 54px ${FONT_CN}`;
  const track=6;
  while(labelW(ctx,label,track)>bw-76&&label.length>2)label=label.slice(0,-1);
  trackedText(ctx,label,cx,by+bh/2,txtCol,track,
    tone==='gold'?'rgba(120,92,40,0.471)':'rgba(0,0,0,0.51)');

  // 顶部窄框标签：副文本或编号
  let topLabel=subtitle||serial||'';
  if(topLabel){
    if([...topLabel].every(c=>c.charCodeAt(0)<128))topLabel=topLabel.toUpperCase();
    const tbw=Math.min(Math.floor(hw(372)*2*0.9),460);
    const tbh=46, tby=cy-372-tbh/2;
    roundedRect(ctx,cx-tbw/2,tby,tbw,tbh,9);
    ctx.fillStyle=topBg; ctx.fill();
    roundedRect(ctx,cx-tbw/2+1,tby+1,tbw-2,tbh-2,8);
    ctx.strokeStyle=rgba(line_mid,0.745); ctx.lineWidth=2; ctx.stroke();
    ctx.font=`23px ${FONT_EN}`;
    while(labelW(ctx,topLabel,3)>tbw-40&&topLabel.length>2)topLabel=topLabel.slice(0,-1);
    ctx.fillStyle=rgba(line_mid,0.784);
    for(const dx2 of[-tbw/2+6,tbw/2-6]){
      ctx.beginPath();
      ctx.moveTo(cx+dx2,tby+tbh/2-5); ctx.lineTo(cx+dx2+5,tby+tbh/2);
      ctx.lineTo(cx+dx2,tby+tbh/2+5); ctx.lineTo(cx+dx2-5,tby+tbh/2);
      ctx.closePath(); ctx.fill();
    }
    trackedText(ctx,topLabel,cx,tby+tbh/2,tagCol,3);
  }
}

function applyAkPlating(canvas){
  // 方舟镀层后处理：提亮 + 降饱和 + 整面全息镀膜 + 多彩漫反射（保持透明区）
  const W=canvas.width, H=canvas.height;
  const x=canvas.getContext('2d');
  const tmp=document.createElement('canvas'); tmp.width=W; tmp.height=H;
  tmp.getContext('2d').drawImage(canvas,0,0);
  x.filter='saturate(0.82) brightness(1.07)';
  x.drawImage(tmp,0,0);
  x.filter='none';
  x.globalCompositeOperation='source-atop';
  x.drawImage(spectralFilm(W,H,35,200,1.18),0,0);
  x.drawImage(spectralFilm(W,H,145,95,1.18),0,0);
  const band=document.createElement('canvas'); band.width=W; band.height=H;
  const bx=band.getContext('2d');
  bx.strokeStyle='rgba(255,255,255,0.118)'; bx.lineWidth=26;
  for(let i=-W;i<W;i+=170){bx.beginPath();bx.moveTo(i,H);bx.lineTo(i+W,0);bx.stroke();}
  const bl=document.createElement('canvas'); bl.width=W; bl.height=H;
  const blx=bl.getContext('2d');
  blx.filter='blur(18px)';
  blx.drawImage(band,0,0);
  x.drawImage(bl,0,0);
  x.globalCompositeOperation='source-over';
}

/* ---- 采样网格 → 纯金属渐变（与引擎 badge_engine._metal_field 同式）----
   素材页把金章和彩色「奇想奖章」混排采样，gold 网格因此夹带橙/绿控制点
   （末行 [149,204,23]、[247,108,7]），直接插值会把章面渲成日落色斑块。
   金属章的色相由色板决定，不该由页面上邻座的彩绘章决定。 */
function rgbToHsv(r,g,b){
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  if(d<=0) return [0,0,mx];
  const s=d/mx;
  let h = mx===r ? ((g-b)/d)%6 : (mx===g ? (b-r)/d+2 : (r-g)/d+4);
  h/=6; if(h<0) h+=1;
  return [h,s,mx];
}
function hsvToRgb(h,s,v){
  const i=Math.floor(h*6), f=h*6-i, p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  switch(((i%6)+6)%6){
    case 0: return [v,t,p]; case 1: return [q,v,p]; case 2: return [p,v,t];
    case 3: return [p,q,v]; case 4: return [t,p,v]; default: return [v,p,q];
  }
}
function median01(a){
  const s=Float64Array.from(a).sort(), n=s.length;
  return n%2 ? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2;
}
/* numpy 默认线性插值分位（与引擎 np.percentile 同口径） */
function pctSorted(sorted,q){
  const n=sorted.length, pos=q/100*(n-1), lo=Math.floor(pos), hi=Math.min(lo+1,n-1);
  return sorted[lo]+(sorted[hi]-sorted[lo])*(pos-lo);
}
function metalFieldGrid(g){
  const rows=g.length, cols=g[0].length, n=rows*cols;
  const R=new Float64Array(n),G=new Float64Array(n),B=new Float64Array(n),lum=new Float64Array(n);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const v=g[r][c]||[128,128,128], i=r*cols+c;
    R[i]=v[0]/255; G[i]=v[1]/255; B[i]=v[2]/255;
    lum[i]=(0.2126*v[0]+0.7152*v[1]+0.0722*v[2])/255;
  }
  const [mh,ms]=rgbToHsv(median01(R),median01(G),median01(B));
  // 采样网格是页面上「一枚枚章的中位色」，章与章之间互相抵消掉单枚章内部的明暗坡道
  // ⇒ 插值出来的场是平的。按中位明度把坡道拉开，拉开量随档位自身亮度缩放。
  const m=median01(lum), sl=Float64Array.from(lum).sort();
  const spread=Math.max(m-pctSorted(sl,4), pctSorted(sl,96)-m, 1e-3);
  const gain=Math.min(2.6, Math.max(0.16, Math.min(0.30, 0.62*m)/spread));
  const out=[];
  for(let r=0;r<rows;r++){
    const row=[];
    for(let c=0;c<cols;c++){
      const i=r*cols+c;
      const l=Math.min(0.99,Math.max(0.04, m+(lum[i]-m)*gain));
      // 金属受光提亮时同时去饱和：恒定饱和渲出来是塑料黄，素材高光区是乳白而非纯黄
      const s=ms*(1-0.72*Math.min(1,Math.max(0,(l-0.58)/0.41)));
      const [rr,rg,rb]=hsvToRgb(mh,s,l);
      const cl=(x)=>Math.min(255,Math.max(0,Math.floor(x*255)));
      row.push([cl(rr),cl(rg),cl(rb)]);
    }
    out.push(row);
  }
  return out;
}

function efGridKey(tone){
  const key=tone.replace(/^ef_/,'');
  return key==='bronze'?'dark':key;   // 铜阶与排名章共用场网格（同引擎 _ef_grid_key）
