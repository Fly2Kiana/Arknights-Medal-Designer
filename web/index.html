<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方舟蚀刻章设计器 · Arknights Medal Designer</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #2d3748;
    --gold: #d4a96e; --cyan: #40ebe0; --text: #e6edf3; --dim: #8b98a9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; height: 100vh; display: flex; overflow: hidden; }
  aside { width: 340px; min-width: 340px; background: var(--panel); border-right: 1px solid var(--line); padding: 18px; overflow-y: auto; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background:
    radial-gradient(1200px 700px at 50% 40%, #131a26 0%, var(--bg) 70%); }
  h1 { font-size: 18px; letter-spacing: 1px; margin-bottom: 4px; color: var(--gold); }
  .sub { font-size: 11px; color: var(--dim); margin-bottom: 16px; line-height: 1.6; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px 12px; text-align: center; color: var(--dim);
    cursor: pointer; transition: all .2s; font-size: 13px; line-height: 1.7; }
  .drop.on { border-color: var(--gold); color: var(--gold); background: rgba(212,169,110,.06); }
  .drop b { color: var(--text); }
  fieldset { border: none; margin-top: 16px; }
  legend, .lbl { font-size: 12px; color: var(--gold); letter-spacing: 2px; margin-bottom: 8px; display: block; }
  .seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .seg button { flex: 1; padding: 9px 4px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; font-size: 12.5px; transition: all .15s; }
  .seg button.act { border-color: var(--gold); color: var(--gold); box-shadow: inset 0 0 12px rgba(212,169,110,.08); }
  input[type=text] { width: 100%; padding: 8px 10px; margin-bottom: 10px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 7px; font-size: 13px; outline: none; }
  input[type=text]:focus { border-color: var(--gold); }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--dim); margin: 8px 0 2px; }
  .row output { color: var(--text); }
  select { width: 100%; padding: 8px; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; font-size: 13px; }
  .btns { display: flex; gap: 10px; margin-top: 18px; }
  .btns button { flex: 1; padding: 11px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: bold; }
  #gen { background: linear-gradient(135deg, #d4a96e, #b8863f); color: #241a08; }
  #dl  { background: var(--panel2); color: var(--text); border: 1px solid var(--line) !important; }
  #status { margin-top: 14px; font-size: 11.5px; color: var(--dim); line-height: 1.6; min-height: 32px; }
  #status.warn { color: #e0b458; } #status.err { color: #e06c5f; }
  canvas#stage { max-width: 92%; max-height: 94vh; border-radius: 8px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
  #placeholder { color: #3a4657; font-size: 15px; letter-spacing: 2px; text-align:center; line-height: 2.2; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--dim); border-top-color:var(--gold);
    border-radius:50%; animation:r 0.8s linear infinite; vertical-align:-2px; margin-right:6px;}
  @keyframes r { to { transform: rotate(360deg);} }
</style>
</head>
<body>
<aside>
  <h1>方舟蚀刻章设计器</h1>
  <div class="sub">参照官方公开素材的设计语言：尖角六边形 · 同心套环 · 哑光网点底 · 蚀刻线描纹章<br>全程本地处理，照片不会上传</div>

  <div class="drop" id="drop">
    <b>点击 / 拖入 / 粘贴</b> 照片<br>建议：主体清晰、背景简洁的照片效果最佳
  </div>
  <input type="file" id="file" accept="image/*" hidden>

  <fieldset>
    <legend>章体模板</legend>
    <div class="seg">
      <button id="m-ak" class="act">方舟蚀刻章</button>
      <button id="m-ef">终末地工业</button>
    </div>
    <span class="lbl">工艺色调</span>
    <select id="tone">
      <option value="silver">晋升银（标准款）</option>
      <option value="gold">活动金章</option>
      <option value="plated">镀层（全息）</option>
      <option value="industrial">荧青（工业）</option>
    </select>
  </fieldset>

  <fieldset>
    <legend>铭文</legend>
    <input type="text" id="t-main" value="蚀刻勋章" placeholder="主文本（横幅字带）">
    <input type="text" id="t-sub" value="" placeholder="顶部标签（可选）">
    <input type="text" id="t-num" value="" placeholder="数字层级（可选，如 100）">
  </fieldset>

  <fieldset>
    <legend>蚀刻参数</legend>
    <div class="row"><span>线稿强度</span><output id="o-ls">1.0</output></div>
    <input type="range" id="r-ls" min="0.4" max="1.8" step="0.05" value="1.0">
    <div class="row"><span>细节密度</span><output id="o-dt">1.0</output></div>
    <input type="range" id="r-dt" min="0.5" max="2.0" step="0.05" value="1.0">
    <label class="row" style="cursor:pointer"><span>跳过抠图（整图入章）</span>
      <input type="checkbox" id="no-mat" style="accent-color:var(--gold)"></label>
  </fieldset>

  <div class="btns">
    <button id="gen">生成蚀刻章</button>
    <button id="dl">下载 PNG</button>
  </div>
  <div id="status">等待上传照片…</div>
</aside>
<main>
  <canvas id="stage" width="1000" height="1150"></canvas>
  <div id="placeholder">◈ 照片将在此呈现为蚀刻章 ◈</div>
</main>
<script type="module">
'use strict';
const $ = id => document.getElementById(id);
const stage = $('stage'), statusEl = $('status');
let srcImage = null, outBlob = null;

function setStatus(msg, cls='') { statusEl.className = cls; statusEl.innerHTML = msg; }

/* ---------------- 上传 ---------------- */
const drop = $('drop'), file = $('file');
drop.onclick = () => file.click();
file.onchange = e => e.target.files[0] && loadFile(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
drop.ondragleave = () => drop.classList.remove('on');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on');
  const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadFile(f); };
window.addEventListener('paste', e => {
  const it = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
  if (it) loadFile(it.getAsFile());
});
function loadFile(f) {
  const img = new Image();
  img.onload = () => { srcImage = img; setStatus(`已载入 ${img.naturalWidth}×${img.naturalHeight}，点击「生成蚀刻章」`); generate(); };
  img.onerror = () => setStatus('图片载入失败', 'err');
  img.src = URL.createObjectURL(f);
}

/* ---------------- 抠图：优先浏览器端 AI 模型，降级内置算法 ---------------- */
let rembgFn = undefined, rembgTried = false;
async function getRembg() {
  if (rembgTried) return rembgFn;
  rembgTried = true;
  const CDNS = [
    'https://esm.sh/@imgly/background-removal@1.5.5',
    'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm',
    'https://unpkg.com/@imgly/background-removal@1.5.5?module',
  ];
  for (const url of CDNS) {
    try {
      setStatus(`<span class="spin"></span>正在加载 AI 抠图模型（仅首次，约几十 MB）…`);
      const mod = await import(url);
      const fn = mod.removeBackground || mod.default;
      if (typeof fn === 'function') { rembgFn = fn; return fn; }
    } catch (e) { /* 下一个 CDN */ }
  }
  rembgFn = null;
  return null;
}
async function aiCut(img) {
  const fn = await getRembg();
  if (!fn) return null;
  try {
    const blob = await fn(await (await fetch(img.src)).blob(), { device: 'cpu' });
    const bmp = await createImageBitmap(await blob);
    const c = document.createElement('canvas'); c.width = bmp.width; c.height = bmp.height;
    c.getContext('2d').drawImage(bmp, 0, 0);
    return c;
  } catch (e) { return null; }
}
async function classicCut(img) {
  const MAX = 640, sc = Math.min(1, MAX / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const N = w * h;
  const px = i => [d[i*4], d[i*4+1], d[i*4+2]];
  const borderIdx = [];
  for (let x = 0; x < w; x++) { borderIdx.push(x, (h-1)*w + x); }
  for (let y = 0; y < h; y++) { borderIdx.push(y*w, y*w + w - 1); }
  let centers = [];
  for (let k = 0; k < 6; k++) centers.push(px(borderIdx[Math.floor(k*(borderIdx.length-1)/5)]));
  for (let it = 0; it < 10; it++) {
    const acc = centers.map(() => [0,0,0,0]);
    for (const bi of borderIdx) {
      const p = px(bi); let best = 0, bd = Infinity;
      centers.forEach((ct, ci) => { const dd0=(p[0]-ct[0])**2+(p[1]-ct[1])**2+(p[2]-ct[2])**2; if(dd0<bd){bd=dd0;best=ci;} });
      acc[best][0]+=p[0];acc[best][1]+=p[1];acc[best][2]+=p[2];acc[best][3]++;
    }
    centers = centers.map((ct,ci)=> acc[ci][3] ? [acc[ci][0]/acc[ci][3],acc[ci][1]/acc[ci][3],acc[ci][2]/acc[ci][3]] : ct);
  }
  const TOL = 26;
  const dbg=new Float32Array(N), coreBg=new Uint8Array(N), barrier=new Uint8Array(N);
  for (let i=0;i<N;i++){ const p=px(i); let m=Infinity;
    for(const ct of centers){const dd0=(p[0]-ct[0])**2+(p[1]-ct[1])**2+(p[2]-ct[2])**2; if(dd0<m)m=dd0;}
    dbg[i]=Math.sqrt(m); coreBg[i]=dbg[i]<=TOL?1:0; barrier[i]=dbg[i]>=TOL+30?1:0; }
  const bg=new Uint8Array(N); const q=[];
  const push=i=>{ if(!bg[i]&&!barrier[i]){bg[i]=1;q.push(i);} };
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x);}
  for(let y=0;y<h;y++){push(y*w);push(y*w+w-1);}
  const tl2=TOL*TOL*3, tg2=(TOL+8)*(TOL+8)*3;
  while(q.length){
    const i=q.pop(); const p=px(i);
    let near=false;
    for(const ct of centers){ if((p[0]-ct[0])**2+(p[1]-ct[1])**2+(p[2]-ct[2])**2<=tg2){near=true;break;} }
    const x=i%w,y=(i/w)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=w||ny>=h)continue;
      const j=ny*w+nx;
      if(bg[j]||barrier[j])continue;
      if(near){bg[j]=1;q.push(j);continue;}
      const pj=px(j);
      if((pj[0]-p[0])**2+(pj[1]-p[1])**2+(pj[2]-p[2])**2<=tl2){bg[j]=1;q.push(j);}
    }
  }
  let fg=new Uint8Array(N);
  for(let i=0;i<N;i++) fg[i]=(bg[i]||coreBg[i])?0:1;
  let cov=0; for(let i=0;i<N;i++)cov+=fg[i]; cov/=N;
  if(cov<0.04||cov>0.96) return null;
  // 连通域多部件
  const lbl=new Int32Array(N); const sizes={}; let cur=0;
  for(let s=0;s<N;s++){
    if(!fg[s]||lbl[s])continue;
    cur++; let sz=0; const qq=[s]; lbl[s]=cur;
    while(qq.length){
      const i=qq.pop(); sz++;
      const x=i%w,y=(i/w)|0;
      for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const j=ny*w+nx;
        if(fg[j]&&!lbl[j]){lbl[j]=cur;qq.push(j);}
      }
    }
    sizes[cur]=sz;
  }
  const biggest=Math.max(...Object.values(sizes));
  const minKeep=Math.max(biggest*0.06,N*0.002,64);
  const keepSet=new Set(Object.entries(sizes).filter(([,sz])=>sz>=minKeep).map(([k])=>+k));
  let kept=new Uint8Array(N);
  for(let i=0;i<N;i++) if(fg[i]&&keepSet.has(lbl[i])) kept[i]=1;
  // 填洞
  const outside=new Uint8Array(N); const oq=[];
  const invPush=i=>{if(!kept[i]&&!outside[i]){outside[i]=1;oq.push(i);}};
  for(let x=0;x<w;x++){invPush(x);invPush((h-1)*w+x);}
  for(let y=0;y<h;y++){invPush(y*w);invPush(y*w+w-1);}
  while(oq.length){
    const i=oq.pop(); const x=i%w,y=(i/w)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=w||ny>=h)continue;
      const j=ny*w+nx; if(!kept[j]&&!outside[j]){outside[j]=1;oq.push(j);}
    }
  }
  for(let i=0;i<N;i++) if(!kept[i]&&!outside[i]) kept[i]=1;
  kept=morph(morph(kept,w,h,false),w,h,true);
  const alpha=feather(kept,w,h);
  const out=document.createElement('canvas'); out.width=img.width; out.height=img.height;
  const oc=out.getContext('2d');
  oc.drawImage(img,0,0);
  const od=oc.getImageData(0,0,out.width,out.height);
  const bigA=resizeAlpha(alpha,w,h,out.width,out.height);
  for(let i=0;i<out.width*out.height;i++) od.data[i*4+3]=bigA[i];
  oc.putImageData(od,0,0);
  return out;
}
function morph(m,w,h,dilate){
  const r=new Uint8Array(m.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let v=dilate?0:1;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const nx=x+dx,ny=y+dy;
      const s=(nx<0||ny<0||nx>=w||ny>=h)?0:m[ny*w+nx];
      v=dilate?(v|s):(v&s);
    }
    r[y*w+x]=v;
  }
  return r;
}
function feather(m,w,h){
  let a=Float32Array.from(m);
  for(let pass=0;pass<2;pass++){
    const t=new Float32Array(a.length);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let s=0,n=0;
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        s+=a[ny*w+nx];n++;
      }
      t[y*w+x]=s/n;
    }
    a=t;
  }
  return a;
}
function resizeAlpha(a,w,h,W,H){
  const out=new Uint8ClampedArray(W*H);
  for(let y=0;y<H;y++){
    const sy=Math.min(h-1,(y*h/H)|0);
    for(let x=0;x<W;x++){
      const sx=Math.min(w-1,(x*w/W)|0);
      out[y*W+x]=Math.round(a[sy*w+sx]*255);
    }
  }
  return out;
}

/* ---------------- 蚀刻纹章化 ---------------- */
const PALETTES = {
  silver:     [[64,74,84],[190,202,209],[247,250,251]],
  gold:       [[214,186,124],[200,156,76],[148,110,44]],
  plated:     [[70,81,92],[196,208,215],[250,252,253]],
  industrial: [[20,27,33],[105,130,138],[214,238,234]],
};
const FIELDS = {
  silver: [[96,108,118],[76,87,97]],
  gold:   [[243,236,216],[222,208,178]],
  plated: [[100,112,122],[80,91,101]],
  industrial: [[26,33,40],[17,23,29]],
};
function grayFlat(rgbaCanvas){
  const c=document.createElement('canvas');c.width=rgbaCanvas.width;c.height=rgbaCanvas.height;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#808080';ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(rgbaCanvas,0,0);
  return ctx.getImageData(0,0,c.width,c.height);
}
function blurLuma(g,wd,ht,sigma){
  const c=document.createElement('canvas');c.width=wd;c.height=ht;
  const cx=c.getContext('2d');
  const im=cx.createImageData(wd,ht);
  for(let i=0;i<wd*ht;i++){im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=Math.max(0,Math.min(255,g[i]*255));im.data[i*4+3]=255;}
  cx.putImageData(im,0,0);
  const b=document.createElement('canvas');b.width=wd;b.height=ht;
  const bc=b.getContext('2d');
  bc.filter=`blur(${sigma}px)`;bc.drawImage(c,0,0);
  const bd=bc.getImageData(0,0,wd,ht).data;
  const out=new Float32Array(wd*ht);
  for(let i=0;i<wd*ht;i++)out[i]=bd[i*4]/255;
  return out;
}
function etchFace(srcCanvas,toneKey,ls,dt,facePx){
  const sc=srcCanvas.getContext('2d');
  const sd=sc.getImageData(0,0,srcCanvas.width,srcCanvas.height).data;
  let minX=1e9,minY=1e9,maxX=-1,maxY=-1;
  for(let y=0;y<srcCanvas.height;y++)for(let x=0;x<srcCanvas.width;x++)
    if(sd[(y*srcCanvas.width+x)*4+3]>24){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  if(maxX<0){minX=0;minY=0;maxX=srcCanvas.width-1;maxY=srcCanvas.height-1;}
  const pw=((maxX-minX)*0.03)|0, ph=((maxY-minY)*0.03)|0;
  minX=Math.max(0,minX-pw);minY=Math.max(0,minY-ph);
  maxX=Math.min(srcCanvas.width-1,maxX+pw);maxY=Math.min(srcCanvas.height-1,maxY+ph);
  const cw=maxX-minX+1, chh=maxY-minY+1;
  const ratio=facePx/Math.max(cw,chh);
  const fw=Math.max(1,Math.round(cw*ratio)), fh=Math.max(1,Math.round(chh*ratio));
  const cut=document.createElement('canvas');cut.width=fw;cut.height=fh;
  cut.getContext('2d').drawImage(srcCanvas,minX,minY,cw,chh,0,0,fw,fh);
  const flat=grayFlat(cut);
  const g=new Float32Array(fw*fh);
  for(let i=0;i<fw*fh;i++)g[i]=(flat.data[i*4]*0.299+flat.data[i*4+1]*0.587+flat.data[i*4+2]*0.114)/255;
  const sigma=Math.max(0.5,1.1/Math.max(dt,0.05));
  const g1=blurLuma(g,fw,fh,sigma), g2=blurLuma(g,fw,fh,sigma*1.9), gb=blurLuma(g,fw,fh,5);
  let emax=1e-6; const edges=new Float32Array(fw*fh);
  for(let i=0;i<fw*fh;i++){edges[i]=Math.abs(g1[i]-g2[i]);if(edges[i]>emax)emax=edges[i];}
  const period=Math.max(6,10/Math.max(dt,0.05)), ang=32*Math.PI/180;
  const pal=PALETTES[toneKey];
  const out=document.createElement('canvas');out.width=fw;out.height=fh;
  const oc=out.getContext('2d');const od=oc.createImageData(fw,fh);
  const ad=cut.getContext('2d').getImageData(0,0,fw,fh).data;
  const lsx=Math.min(1.8,Math.max(0.3,ls));
  for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){
    const i=y*fw+x;
    const e=Math.min(1,edges[i]/(emax*0.55));
    const tn=1-gb[i];
    const s=x*Math.sin(ang)+y*Math.cos(ang);
    const fr=Math.abs(((s/period)%1)-0.5)*2;
    const hatch=(1-Math.min(1,fr*1.5))*Math.min(1,Math.max(0,tn*1.4-0.35))*0.30;
    let t=0.26+(1-tn)*0.22+e*0.72*lsx+hatch*0.85*lsx;
    t=Math.max(0,Math.min(1,t));
    let r,gg,b2;
    if(t<0.5){const u=t*2;r=pal[0][0]+(pal[1][0]-pal[0][0])*u;gg=pal[0][1]+(pal[1][1]-pal[0][1])*u;b2=pal[0][2]+(pal[1][2]-pal[0][2])*u;}
    else{const u=t*2-1;r=pal[1][0]+(pal[2][0]-pal[1][0])*u;gg=pal[1][1]+(pal[2][1]-pal[1][1])*u;b2=pal[1][2]+(pal[2][2]-pal[1][2])*u;}
    od.data[i*4]=r;od.data[i*4+1]=gg;od.data[i*4+2]=b2;od.data[i*4+3]=ad[i*4+3];
  }
  oc.putImageData(od,0,0);
  return out;
}

/* ---------------- 模板绘制（与 Python 引擎早期模板同语言） ---------------- */
function hexPath(ctx,cx,cy,r,rotDeg=0){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(rotDeg+i*60-90)*Math.PI/180;
    const X=cx+r*Math.cos(a),Y=cy+r*Math.sin(a);
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
  ctx.closePath();
}
function chamferPath(ctx,x0,y0,x1,y1,c){
  ctx.beginPath();
  ctx.moveTo(x0+c,y0);ctx.lineTo(x1-c,y0);ctx.lineTo(x1,y0+c);ctx.lineTo(x1,y1-c);
  ctx.lineTo(x1-c,y1);ctx.lineTo(x0+c,y1);ctx.lineTo(x0,y1-c);ctx.lineTo(x0,y0+c);
  ctx.closePath();
}
function roundedRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function drawStar(ctx,cx,cy,r,fill){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const rr=i%2===0?r:r*0.45;
    const a=(-90+i*36)*Math.PI/180;
    const X=cx+rr*Math.cos(a),Y=cy+rr*Math.sin(a);
    i?ctx.lineTo(X,Y):ctx.moveTo(X,Y);
  }
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function halftoneOver(ctx,W,H,alpha,color){
  ctx.save();ctx.globalAlpha=alpha/255;ctx.fillStyle=color;
  const P=6;
  for(let y=P>>1;y<H;y+=P)for(let x=P>>1;y%P===0&&((x+y/P)%2?x:x+3)<W;x+=P)
    ctx.fillRect(x,y,2,2);
  ctx.restore();
}
function pasteFaceWithOutline(canvas,face,cx,cy){
  const fx=Math.round(cx-face.width/2),fy=Math.round(cy-face.height/2);
  // 暗色落刀描边
  const tmp=document.createElement('canvas');tmp.width=face.width;tmp.height=face.height;
  const tc=tmp.getContext('2d');
  tc.drawImage(face,0,0);
  const id=tc.getImageData(0,0,tmp.width,tmp.height);
  const dd=tmp.getContext('2d');
  const hi=document.createElement('canvas');hi.width=tmp.width;hi.height=tmp.height;
  const hc=hi.getContext('2d');hc.filter='blur(1px)';hc.drawImage(tmp,0,0);
  hc.filter='none';
  const grow=document.createElement('canvas');grow.width=tmp.width;grow.height=tmp.height;
  const gc=grow.getContext('2d');
  for(const[ox,oy]of[[-2,0],[2,0],[0,-2],[0,2],[-1,-1],[1,1],[-1,1],[1,-1]])gc.drawImage(hi,ox,oy);
  gc.globalCompositeOperation='destination-in';gc.drawImage(hi,0,0);
  gc.globalCompositeOperation='source-over';
  const gd=gc.getImageData(0,0,tmp.width,tmp.height);
  const base=tc.getImageData(0,0,tmp.width,tmp.height);
  for(let i=0;i<gd.data.length;i+=4)
    gd.data[i+3]=Math.max(0,gd.data[i+3]-base.data[i+3]);
  const darkCol=[38,45,53];
  for(let i=0;i<gd.data.length;i+=4){
    if(gd.data[i+3]>10){gd.data[i]=darkCol[0];gd.data[i+1]=darkCol[1];gd.data[i+2]=darkCol[2];gd.data[i+3]=235;}
  }
  dd.putImageData(gd,0,0);
  canvas.getContext('2d').drawImage(tmp,fx,fy);
}
const FONT_STACK='"Microsoft YaHei","Noto Sans SC",sans-serif';
const FONT_BLACK='"Arial Black","Microsoft YaHei",sans-serif';
const MONO_STACK='"Consolas","Menlo",monospace';

function composeArknights(canvas, face, text, subtitle, number, tone) {
  const CW=1000, CH=1150, cx=CW/2, cy=560, R=500;
  canvas.width=CW;canvas.height=CH;
  const ctx=canvas.getContext('2d');
  let line_hi,line_mid,line_lo,outline_c;
  if(tone==='gold'){line_hi=[239,228,192];line_mid=[201,162,79];line_lo=[138,106,47];outline_c='#201b14';}
  else if(tone==='plated'){line_hi=[240,245,247];line_mid=[174,190,199];line_lo=[96,110,122];outline_c='#1c2128';}
  else{line_hi=[232,238,240];line_mid=[169,179,187];line_lo=[96,108,120];outline_c='#2b323a';}
  const fld=FIELDS[tone];

  // 底场
  ctx.save();hexPath(ctx,cx,cy,R);ctx.clip();
  const g=ctx.createLinearGradient(0,cy-R,0,cy+R);
  g.addColorStop(0,`rgb(${fld[0]})`);g.addColorStop(1,`rgb(${fld[1]})`);
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  // 同心套环
  for(const[r,wd,col]of[[R-4,3,line_hi],[R-26,2,line_mid],[R-44,2,line_mid],[R-60,2,line_lo]]){
    hexPath(ctx,cx,cy,r);ctx.strokeStyle=`rgba(${col},1)`;ctx.lineWidth=wd;ctx.stroke();
  }
  if(tone==='gold'){
    const rs=R-112;
    hexPath(ctx,cx,cy,rs);ctx.strokeStyle=`rgba(${line_mid},0.78)`;ctx.lineWidth=2;ctx.stroke();
    for(let i=0;i<14;i++){
      const a=(-90+i*(360/14))*Math.PI/180;
      drawStar(ctx,cx+rs*Math.cos(a),cy+rs*Math.sin(a),9,`rgba(${line_hi},0.94)`);
    }
  }

  // 放射密纹
  const apothem=R*Math.sqrt(3)/2;
  const rayC=tone!=='gold'?`rgba(${line_lo},0.43)`:'rgba(186,146,68,0.55)';
  ctx.strokeStyle=rayC;ctx.lineWidth=4;
  for(let i=0;i<72;i++){
    const a=i*5*Math.PI/180;
    const r1=i%2===0?apothem-20:apothem-84;
    ctx.beginPath();
    ctx.moveTo(cx+92*Math.cos(a),cy-10+92*Math.sin(a));
    ctx.lineTo(cx+r1*Math.cos(a),cy-10+r1*Math.sin(a));
    ctx.stroke();
  }

  // 网点（垫底）
  ctx.save();hexPath(ctx,cx,cy,R);ctx.clip();
  halftoneOver(ctx,CW,CH,tone==='gold'?60:46,tone==='gold'?'#78643e':'#101318');
  ctx.restore();

  // 主体
  const fr=Math.min(650/Math.max(face.width,face.height),1);
  const fw=Math.round(face.width*fr),fh=Math.round(face.height*fr);
  const f2=document.createElement('canvas');f2.width=fw;f2.height=fh;
  f2.getContext('2d').drawImage(face,0,0,fw,fh);
  pasteFaceWithOutline(canvas,f2,cx,cy-fh/2-(40)+fh/2);

  if(tone==='plated'){
    // 边框环带虹彩（随形简化版）
    ctx.save();hexPath(ctx,cx,cy,R-8);ctx.clip();
    hexPath(ctx,cx,cy,R-58);ctx.clip('evenodd');
    const ig=ctx.createLinearGradient(0,0,CW,CH);
    ig.addColorStop(0,'rgba(126,212,226,0.5)');ig.addColorStop(0.35,'rgba(200,122,198,0.42)');
    ig.addColorStop(0.7,'rgba(99,184,166,0.45)');ig.addColorStop(1,'rgba(127,164,196,0.4)');
    ctx.fillStyle=ig;ctx.fillRect(0,0,CW,CH);
    ctx.restore();
    // 主体轮廓缘虹彩
    ctx.save();hexPath(ctx,cx,cy,R);ctx.clip();
    ctx.globalCompositeOperation='lighter';
    ctx.drawImage(f2,0,0);ctx.globalCompositeOperation='source-over';
    ctx.restore();
  }

  // 文字
  const fEn=`56px ${FONT_BLACK}`, fCn=`54px ${FONT_STACK}`, fTag=`24px ${FONT_BLACK}`;
  let txtCol,tagCol,bandBg,bandBd,topBg;
  if(tone==='gold'){txtCol='rgb(96,72,28)';tagCol='rgba(140,106,44,0.94)';bandBg='rgba(255,250,236,0.67)';bandBd=`rgba(${line_mid},0.9)`;topBg='rgba(250,244,226,0.59)';}
  else{txtCol=`rgb(${line_hi})`;tagCol=`rgba(${line_hi},0.92)`;bandBg='rgba(52,62,72,0.78)';bandBd=`rgba(${line_mid},0.86)`;topBg='rgba(46,55,64,0.67)';}

  const hw=d=>{const dd0=Math.abs(d);return dd0>=R?0:(R-dd0)/R*(R*Math.sqrt(3)/2);};
  const bw=Math.min(Math.floor(hw(292)*2*0.94),520), bh=78, by=cy+292-bh/2;
  roundedRect(ctx,cx-bw/2,by,bw,bh,14);
  ctx.fillStyle=bandBg;ctx.fill();ctx.strokeStyle=bandBd;ctx.lineWidth=3;ctx.stroke();
  let label=number?`${text} · ${number}`:text;
  const isEN=[...label].every(c=>c.charCodeAt(0)<128);
  ctx.font=isEN?fEn:fCn;ctx.textAlign='center';ctx.textBaseline='middle';
  while(ctx.measureText(label).width>bw-40&&label.length>2)label=label.slice(0,-1);
  ctx.fillStyle=tone==='gold'?'rgba(120,92,40,0.47)':'rgba(0,0,0,0.51)';
  ctx.fillText(label,cx+1,by+bh/2+2);
  ctx.fillStyle=txtCol;ctx.fillText(label,cx,by+bh/2);
  if(!isEN){ctx.fillStyle=txtCol;ctx.fillText(label,cx-1.4,by+bh/2);}

  let topLabel=(subtitle||'').toUpperCase?subtitle:subtitle;
  topLabel=subtitle||'';
  if(topLabel){
    if([...topLabel].every(c=>c.charCodeAt(0)<128))topLabel=topLabel.toUpperCase();
    const tbw=Math.min(Math.floor(hw(372)*2*0.9),460),tbh=46,tby=cy-372-tbh/2;
    roundedRect(ctx,cx-tbw/2,tby,tbw,tbh,9);
    ctx.fillStyle=topBg;ctx.fill();ctx.strokeStyle=`rgba(${line_mid},0.75)`;ctx.lineWidth=2;ctx.stroke();
    ctx.font=fTag;
    while(ctx.measureText(topLabel).width>tbw-30&&topLabel.length>2)topLabel=topLabel.slice(0,-1);
    ctx.fillStyle=tagCol;ctx.fillText(topLabel,cx,tby+tbh/2);
  }
}

function composeEndfield(canvas, face, text, subtitle, serial) {
  const W=1240,H=1120,m=76,ch=30;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  const mint='143,214,195', yellow='233,200,76', red='196,53,43';

  // 近黑底板
  ctx.save();chamferPath(ctx,m,m,W-m,H-m,ch);ctx.clip();
  const bgG=ctx.createLinearGradient(0,m,0,H-m);
  bgG.addColorStop(0,'rgb(38,41,45)');bgG.addColorStop(1,'rgb(20,22,25)');
  ctx.fillStyle=bgG;ctx.fillRect(0,0,W,H);
  // 点阵
  ctx.fillStyle='rgba(90,98,106,0.63)';
  for(let gx=m+20;gx<m+240;gx+=14)for(let gy=H-m-240;gy<H-m-20;gy+=14)ctx.fillRect(gx,gy,1.5,1.5);
  ctx.restore();

  // 薄荷青细边 + 微光
  ctx.save();chamferPath(ctx,m,m,W-m,H-m,ch);
  ctx.shadowColor=`rgba(${mint},0.28)`;ctx.shadowBlur=6;
  ctx.strokeStyle=`rgba(${mint},0.78)`;ctx.lineWidth=2;ctx.stroke();ctx.restore();
  ctx.save();chamferPath(ctx,m+16,m+16,W-m-16,H-m-16,ch-10);
  ctx.strokeStyle=`rgba(${mint},0.31)`;ctx.lineWidth=1;ctx.stroke();ctx.restore();

  // HUD
  const fs=s=>`${s}px ${MONO_STACK}`;
  ctx.font=fs(20);ctx.textBaseline='alphabetic';
  ctx.beginPath();ctx.arc(m+35,m+33,7,0,7);ctx.fillStyle=`rgb(${red})`;ctx.fill();
  ctx.fillStyle='rgb(210,214,218)';ctx.fillText('REC',m+52,m+40);
  ctx.fillStyle='rgb(150,156,163)';ctx.fillText('P 80/120',W-m-150,m+40);
  ctx.fillStyle='rgb(120,126,133)';ctx.fillText('50/120',W-m-150,m+66);
  ctx.fillStyle='rgba(233,200,76,0.78)';ctx.fillRect(m+24,m+62,104,6);
  ctx.fillStyle='rgba(233,200,76,0.75)';ctx.fillRect(W-m-128,m+84,104,4);
  const cam='CAM-06 // ARCHIVE';
  ctx.fillStyle='rgba(120,126,133,0.82)';
  ctx.fillText(cam,(W-ctx.measureText(cam).width)/2,m+38);

  // 凹槽 + 角标
  const fr=540/Math.max(face.width,face.height);
  const fw=Math.round(face.width*fr),fh=Math.round(face.height*fr);
  const fx=W/2-fw/2, fy=250;
  ctx.fillStyle='rgb(13,15,18)';
  ctx.fillRect(fx-30,fy-30,fw+60,fh+60);
  ctx.strokeStyle='rgb(58,64,70)';ctx.lineWidth=2;
  ctx.strokeRect(fx-30,fy-30,fw+60,fh+60);
  const cl=22;
  ctx.strokeStyle=`rgba(${mint},0.86)`;ctx.lineWidth=3;
  for(const[px2,py2,dx,dy]of[[fx-30,fy-30,1,1],[fx+fw+30,fy-30,-1,1],[fx-30,fy+fh+30,1,-1],[fx+fw+30,fy+fh+30,-1,-1]]){
    ctx.beginPath();ctx.moveTo(px2,py2);ctx.lineTo(px2+dx*cl,py2);
    ctx.moveTo(px2,py2);ctx.lineTo(px2,py2+dy*cl);ctx.stroke();
  }
  ctx.drawImage(face,fx,fy,fw,fh);

  // 标题区
  const tx=H-m-150+52;
  const fsz=text.length<=8?52:40;
  ctx.font=`${fsz}px ${FONT_STACK}`;
  const tw=ctx.measureText(text).width;
  ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillText(text,W/2-tw/2+2,tx+2);
  ctx.fillStyle='rgb(226,230,233)';ctx.fillText(text,W/2-tw/2,tx);
  if(subtitle){
    ctx.font=`25px ${FONT_STACK}`;
    const sw=ctx.measureText(subtitle).width;
    ctx.fillStyle='rgba(168,174,180,0.92)';ctx.fillText(subtitle,W/2-sw/2,tx+64);
  }
  ctx.fillStyle=`rgba(${yellow},0.82)`;
  ctx.fillRect(W/2-130,tx+(subtitle?100:66),260,6);

  const sn=serial||'ENDFIELD ARCHIVE · MEDAL';
  ctx.font=fs(20);ctx.fillStyle='rgba(140,146,152,0.88)';
  ctx.fillText(sn,m+40,H-m-42);
  ctx.font=fs(26);ctx.fillStyle=`rgba(${yellow},0.9)`;
  const tag='NO.006';
  ctx.fillText(tag,W-m-44-ctx.measureText(tag).width,m+48);
}

/* ---------------- 主流程 ---------------- */
let style='arknights';
$('m-ak').onclick=()=>{style='arknights';$('m-ak').className='act';$('m-ef').className='';};
$('m-ef').onclick=()=>{style='endfield';$('m-ef').className='act ef';$('m-ak').className='';};
$('r-ls').oninput=e=>$('o-ls').value=(+e.target.value).toFixed(2);
$('r-dt').oninput=e=>$('o-dt').value=(+e.target.value).toFixed(2);

let busy=false;
async function generate(){
  if(busy||!srcImage)return;
  busy=true;$('gen').disabled=true;
  try{
    let subject=null;
    if(!$('no-mat').checked){
      setStatus('<span class="spin"></span>AI 抠图中…');
      subject=await aiCut(srcImage);
      if(subject)setStatus('AI 模型抠图完成');
      else{
        setStatus('<span class="spin"></span>AI 模型不可用，使用内置算法抠图…');
        subject=await classicCut(srcImage);
        if(subject)setStatus('已用内置算法完成抠图','warn');
        else{subject=srcImage;setStatus('自动抠图置信度低，回退整图。可勾选「跳过抠图」','warn');}
      }
    }else subject=srcImage;
    setStatus('<span class="spin"></span>蚀刻风格化与合成中…');
    await new Promise(r=>setTimeout(r,30));
    const tone=$('tone').value;
    const effTone=style==='arknights'?tone:'industrial';
    const face=etchFace(subject,effTone,+$('r-ls').value,+$('r-dt').value,650);
    if(style==='arknights')
      composeArknights(stage,face,$('t-main').value||'蚀刻勋章',$('t-sub').value.trim(),$('t-num').value.trim(),effTone);
    else
      composeEndfield(stage,face,$('t-main').value||'蚀刻勋章',$('t-sub').value.trim(),'NO.006');
    $('placeholder').style.display='none';
    stage.toBlob(b=>{outBlob=b;},'image/png');
    setStatus('完成 ✔ 全程本地处理');
  }catch(err){
    setStatus('生成失败：'+err.message,'err');console.error(err);
  }finally{busy=false;$('gen').disabled=false;}
}
$('gen').onclick=generate;
$('dl').onclick=()=>{
  if(!outBlob){setStatus('请先生成蚀刻章','warn');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(outBlob);
  a.download=`arknights_medal_designer_${style}_${Date.now()}.png`;
  a.click();
};
setStatus('等待上传照片…');
