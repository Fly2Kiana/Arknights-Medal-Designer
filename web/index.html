const EF38_DARK_X=[0,0.16,0.28,1],EF38_DARK_Y=[1,1,0,0];
const EF38_SHELF_X=[0,0.16,0.30,0.42,0.50,0.58,0.64,0.70,1],EF38_SHELF_Y=[0,0,0.80,0.95,0.50,0.80,0.55,0,0];
const EF38_DARK_M=ef38PchipSlopes(EF38_DARK_X,EF38_DARK_Y);
const EF38_SHELF_M=ef38PchipSlopes(EF38_SHELF_X,EF38_SHELF_Y);
function ef38PchipEval(x,y,m,xq){
  const n=x.length,xc=Math.min(Math.max(xq,x[0]),x[n-1]);
  let cnt=0;for(let i=0;i<n;i++){if(x[i]<=xc)cnt++;}
  const idx=Math.min(Math.max(cnt-1,0),n-2);
  const hk=x[idx+1]-x[idx],t=(xc-x[idx])/hk,t2=t*t,t3=t2*t;
  return (2*t3-3*t2+1)*y[idx]+(t3-2*t2+t)*hk*m[idx]+(-2*t3+3*t2)*y[idx+1]+(t3-t2)*hk*m[idx+1];
}
function ef38Additive(tt){
  return EF38.shelfamp*ef38PchipEval(EF38_SHELF_X,EF38_SHELF_Y,EF38_SHELF_M,tt)
       - EF38.darkamp*ef38PchipEval(EF38_DARK_X,EF38_DARK_Y,EF38_DARK_M,tt);
}

function composeEndfield(canvas, face, number, serial, toneRaw, fam='story') {
  // 下拉原始值 → 引擎同名 ef_ 键（修复 v2 同步遗留的键不匹配：品阶参数/珠光分支此前不生效）
  const tone = ({silver:'ef_silver',gold_pure:'ef_gold_pure',gold_plated:'ef_gold',dark:'ef_dark',bronze:'ef_bronze',pearl:'ef_pearl'})[toneRaw] || toneRaw;
  const CW=1000, CH=1240, cx=CW/2, cy=620, R=470;
  canvas.width=CW; canvas.height=CH;
  const ctx=canvas.getContext('2d');
  const apothem=R*Math.sqrt(3)/2;
  const soft = tone==='ef_gold_pure';
  const tp = EF_TONE_V2[tone] || EF_TONE_V2.ef_silver;
  const f_mid = tp.field[1];
  const engrave_c = tp.engrave, accent = tp.accent;
  // 装饰四层（描边/角部注记/网点/铭牌）的颜色与落笔参数一律读生成块：它由
  // 由 badge_engine 自己的取数函数导出，与引擎实喂逐字节同。
  const LM = EF_LAYER_MEASURED.tones[tone] || EF_LAYER_MEASURED.tones.ef_silver;
  const LG = EF_LAYER_MEASURED.geom;
  const outline_c = LM.edge;
  const corner_c = LM.corner || engrave_c;
  const dot_c = LM.lowdot || f_mid.map(v=>Math.round(v*LG.dot.fallbackScale));
  const axis = fam==='story' ? 55 : 35;

  const hexMask=document.createElement('canvas'); hexMask.width=CW; hexMask.height=CH;
  const hmx=hexMask.getContext('2d');
  hexPath(hmx,cx,cy,R-3);
  hmx.fillStyle='#fff'; hmx.fill();

  // ---- 场：珠光=白底离散色斑软扩散 / 金属=采样网格多方向非对称渐变 ----
  if(tone==='ef_pearl' && !EF_FIELD_GRIDS['pearl']){
    const f=efPearlBlobsField(CW,CH,cx,cy,R);   // 兜底：无网格数据时才用旧色斑模型
    if(f) ctx.drawImage(f,0,0);
  }else{
    const f=efFieldCanvas(tone,CW,CH);
    if(f){
      const fc=f.getContext('2d');
      const im=fc.getImageData(0,0,CW,CH), d=im.data;
      const cE = soft?1.02:1.06;
      for(let y=0;y<CH;y++){
        for(let x=0;x<CW;x++){
          const o=(y*CW+x)*4;
          const e=Math.pow(Math.min(1.15,Math.sqrt(((x-cx)/(R*0.98))**2+((y-cy)/(R*1.08))**2)),1.6);
          let boost=(soft?1+0.30*e:1+0.35*e)*cE;
          if(tone==='ef_pearl') boost*=1.45;   // R-16h：用户裁定颜色要猛（与引擎 1.45 对齐）
          const m=(d[o]+d[o+1]+d[o+2])/3;
          let lo=Math.min(d[o],d[o+1],d[o+2]);
          if(m+(lo-m)*boost<0) boost=m/Math.max(m-lo,1e-3);   // R-24 逐像素防穿零（同引擎 cap）
          for(let k=0;k<3;k++){const v=m+(d[o+k]-m)*boost; d[o+k]=v<0?0:(v>255?255:v);}
        }
      }
      fc.putImageData(im,0,0);
      // R-17：官方深灰无宽亮环（旧'rim 140'测量系章顶金属搭扣混入 d 分箱）——亮环已删
      fc.drawImage(brushedStreaks(CW,CH,axis,230,13,11),0,0);
      if(tone==='ef_dark'||tone==='ef_bronze'){ fc.drawImage(brushedStreaks(CW,CH,axis,420,18,11,1,0.45),0,0); }   // R-16 深灰拉丝对齐引擎
      else if(tone==='ef_silver'){ fc.drawImage(brushedStreaks(CW,CH,axis,420,30,11,1,0.8),0,0); }   // R-16 银章暗划痕为主（白线在银底不可见）
      ctx.drawImage(f,0,0);
    }else{
      ctx.fillStyle=rgb(f_mid);
      hexPath(ctx,cx,cy,R-3);
      ctx.fill();
    }
  }

  // ---- 底部网点渐隐（点色/点径/坡道全部读生成块，与引擎同一条合成式）----
  // 引擎：tile 里烤进 dotAlpha，再乘坡道 mask=190*t ⇒ 有效不透明度 dotAlpha*rampCap*t
  ctx.fillStyle=rgba(dot_c, LM.lowdot?LG.dot.alphaMeasured:LG.dot.alphaFallback);
  const yS=cy+apothem*LG.dot.start, yE=cy+apothem, DP=LG.dot.period, DR=LG.dot.r;
  // 相位与引擎的瓦片网格对齐（点心在 DP/2+k·DP），否则两侧网点错开半格
  for(let y=Math.ceil((yS+DR-DP/2)/DP)*DP+DP/2;y<yE-DR;y+=DP){
    const t=Math.min(1,Math.max(0,(y-yS)/(yE-yS)));
    if(t<=0) continue;
    ctx.globalAlpha=LG.dot.rampCap*t;
    ctx.beginPath();
    for(let x=DP/2;x<CW;x+=DP){ ctx.moveTo(x+DR,y); ctx.arc(x,y,DR,0,Math.PI*2); }
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // ---- 中央纹章（整图入章时铺满章面，随金属一起被打光坡道扫过）----
  const fAd=face.getContext('2d').getImageData(0,0,face.width,face.height).data;
  let faMin=255;
  for(let i=0;i<face.width*face.height;i++) if(fAd[i*4+3]<faMin) faMin=fAd[i*4+3];
  const fullBleed=faMin>200;
  // 缩放上限与引擎 badge_engine.py EMBLEM_CAP 同值。旧写法按 tone/fam 分档（650/580），
  // 但 face_px=520 时 fr 恒为 1，那一档永远用不上；两边都改成 660 后纹章才真吃满尺寸。
  const frMax=690;
  const fr=fullBleed ? Math.max((apothem*2-20)/face.width,(2*R-34)/face.height)
                     : Math.min(frMax/Math.max(face.width,face.height),1);
  const fw=Math.max(1,Math.round(face.width*fr)), fh=Math.max(1,Math.round(face.height*fr));
  const f2=document.createElement('canvas'); f2.width=fw; f2.height=fh;
  const f2x=f2.getContext('2d');
  f2x.imageSmoothingEnabled=true; f2x.imageSmoothingQuality='high';
  f2x.drawImage(face,0,0,fw,fh);
  const fx=cx-Math.floor(fw/2), fy=cy-Math.floor(fh/2)-(fullBleed?0:10);
  // 落影：素材的纹章是「贴在金属面上的凸起件」，右下永远有一条硬边暗影。
  // 没有这条影，浅色纹章就化进色场里看不见（旧稿的主要失分点）。
  // 铺满档不投影：它本身就是金属面，不是贴在面上的凸起件。（与引擎同序：先模糊再乘 0.80）
  if(!fullBleed){
    const f2d=f2x.getImageData(0,0,fw,fh).data;
    const am=document.createElement('canvas'); am.width=fw; am.height=fh;
    const amx=am.getContext('2d');
    const aid=amx.createImageData(fw,fh);
    for(let i=0;i<fw*fh;i++){aid.data[i*4]=aid.data[i*4+1]=aid.data[i*4+2]=255; aid.data[i*4+3]=f2d[i*4+3];}
    amx.putImageData(aid,0,0);
    const amb=document.createElement('canvas'); amb.width=fw; amb.height=fh;
    const abx=amb.getContext('2d'); abx.filter='blur(2.2px)'; abx.drawImage(am,0,0);
    const sc=document.createElement('canvas'); sc.width=fw; sc.height=fh;
    const sx=sc.getContext('2d');
    sx.fillStyle=rgb(SILO_SHADE_K>=1.0?PALETTES[tone][0].map(v=>Math.round(v*SILO_SHADE_MUL)):engrave_c);
    sx.fillRect(0,0,fw,fh);
    const sim=sx.getImageData(0,0,fw,fh), md=abx.getImageData(0,0,fw,fh).data;
    const shA=SILO_SHADE_K>=1.0?SILO_SHADE_A:0.80;
    for(let i=0;i<fw*fh;i++) sim.data[i*4+3]=Math.round(md[i*4+3]*shA);
    sx.putImageData(sim,0,0);
    ctx.drawImage(sc,fx+9,fy+11);
  }
  ctx.drawImage(f2,fx,fy);

  // ---- 方向性打光（官方实测分档，与引擎同参）----
  // 色场网格已含官方打光，此层只沿实测亮向轻度强化：方向角 gold -29°/dark -44°/silver -103°/pearl -167°
  // （纯金档不走这张表：由 EF38 单独定档，见上方 ef38Lux 与引擎 `if tone == "ef_gold_pure" and EF38_GOLD_LUX > 0.0:` 那道接线门）
  const EF_LUX={ef_gold:[[0.87,-0.48],1.12],ef_gold_pure:[[0.80,-0.60],1.16],ef_dark:[[0.70,0.71],1.35],ef_bronze:[[0.70,0.71],1.35],ef_silver:[[0.80,-0.60],1.16],ef_pearl:[[-0.97,-0.22],1.06]};
  const im2=ctx.getImageData(0,0,CW,CH), d2=im2.data;
  if(tone==='ef_gold_pure'){
    // TB-31 EF38：全画布方向打光，纹章合成之后、描边之前（与引擎同一处）。
    // 门写成嵌套而非 `else`：引擎 lux<=0 时整块不执行、也不落进 EF_LUX 表 ⇒ 同链路才可逐字节回退。
    if(EF38.lux>0){
      for(let y=0;y<CH;y++){
        for(let x=0;x<CW;x++){
          const o=(y*CW+x)*4, tt=ef38Tt(x,y,cx,cy,R), l=ef38Lux(x,y,cx,cy,R);
          // R12 加项与乘光同一步 clip（引擎 clip(rgb*light)+offset 同口径）；amp=0 时 off=0 逐字节回退
          const off=(EF38.darkamp!==0||EF38.shelfamp!==0)?ef38Additive(tt):0;
          d2[o]=Math.min(255,Math.max(0,d2[o]*l+off)); d2[o+1]=Math.min(255,Math.max(0,d2[o+1]*l+off)); d2[o+2]=Math.min(255,Math.max(0,d2[o+2]*l+off));
          // screen 向白：只在 alpha>0 处施加（引擎 np.where(alpha>0, lite4, rgb4) 同口径），
          // 否则会把透明像素的 RGB 抬离 0 ⇒ 与引擎逐字节面漂开。
          if(EF38.sk>0&&d2[o+3]>0){
            const w=ef38SkW(tt);
            d2[o]=Math.min(255,d2[o]+EF38.sk*(255-d2[o])*w);
            d2[o+1]=Math.min(255,d2[o+1]+EF38.sk*(255-d2[o+1])*w);
            d2[o+2]=Math.min(255,d2[o+2]+EF38.sk*(255-d2[o+2])*w);
          }
        }
      }
    }
  }else{
    const [luxD,luxS]=EF_LUX[tone]||[[0.87,-0.48],1.12];
    const luxLo=2/(1+luxS), luxHi=luxS*luxLo;
    for(let y=0;y<CH;y++){
      for(let x=0;x<CW;x++){
        const o=(y*CW+x)*4;
        const t=Math.min(1,Math.max(0,((x-cx)*luxD[0]+(y-cy)*luxD[1])/(R*1.1)/2+0.5));
        const l=luxLo+(luxHi-luxLo)*Math.pow(t,1.1);
        d2[o]=Math.min(255,d2[o]*l); d2[o+1]=Math.min(255,d2[o+1]*l); d2[o+2]=Math.min(255,d2[o+2]*l);
      }
    }
  }
  ctx.putImageData(im2,0,0);

  // ---- 装饰簇落点/电平门（TB-33 R-6，与引擎 `_deco_geo`/`_deco`/`_deco_c` 同式同参）----
  // 本页与引擎同序：暗笔直接画在**已上光**的画布上、落点是硬编码坐标 ⇒ 右上受光顶区被凿回深棕。
  // 落点 = 整簇 bbox 须在「章内(R-inset-bandW) ∩ 主体（凸起件）外」，否则整簇不落笔；
  // 电平 = bbox 平均 tt > decoTtMax（受光侧）时笔画色换成 engrave 奶白，alpha 不变。
  // 只作用于 ef_gold_pure；decoGate=0 时返回 [true,false] ⇒ 逐字节回退。
  const DECO_HEX=hexPts(cx,cy,R-LG.edge.inset-LG.edge.bandW);
  let DECO_FA=null;
  function decoFaceAlpha(){
    if(DECO_FA===null)DECO_FA=f2x.getImageData(0,0,fw,fh).data;
    return DECO_FA;
  }
  function decoHexIn(x,y){
    let pos=0,neg=0;
    for(let i=0;i<6;i++){
      const A=DECO_HEX[i],B=DECO_HEX[(i+1)%6];
      const cr=(B[0]-A[0])*(y-A[1])-(B[1]-A[1])*(x-A[0]);
      if(cr>0)pos++;else if(cr<0)neg++;
    }
    return pos===0||neg===0;
  }
  function decoOk(x0,y0,x1,y1){
    if(!(EF38.decoGate>0)||tone!=='ef_gold_pure')return[true,false];
    const fa=decoFaceAlpha();
    const xa=Math.max(0,Math.trunc(Math.min(x0,x1))),xb=Math.min(CW,Math.trunc(Math.max(x0,x1))+1);
    const ya=Math.max(0,Math.trunc(Math.min(y0,y1))),yb=Math.min(CH,Math.trunc(Math.max(y0,y1))+1);
    if(xa>=xb||ya>=yb)return[false,false];
    let tsum=0,n=0;
    for(let y=ya;y<yb;y++)for(let x=xa;x<xb;x++){
      if(!decoHexIn(x,y))return[false,false];
      const sx=x-fx,sy=y-fy;
      if(sx>=0&&sy>=0&&sx<fw&&sy<fh&&fa[(sy*fw+sx)*4+3]>=8)return[false,false];
      tsum+=ef38Tt(x,y,cx,cy,R);n++;
    }
    return[true,(tsum/Math.max(n,1))>EF38.decoTtMax];
  }
  // 受光侧的暗笔电平见下方销钉：引擎 `_deco_c` 同口径（暗乘子 → engrave 奶白）。
  // 本页条纹本就是奶白浅笔（engrave_c 0.24），只有销钉是暗笔 ⇒ 电平门只接在销钉上。

  // ---- 剧情章装饰：侧轨/条纹簇/销钉+点阵 ----
  if(fam==='story'){
    const rail=rgba(engrave_c,0.47);
    const lx=cx-apothem+16, rx2=cx+apothem-16;
    ctx.lineWidth=1; ctx.strokeStyle=rail;
    ctx.beginPath(); ctx.moveTo(lx,cy-R+90); ctx.lineTo(lx,cy+R-110); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx2,cy-R+90); ctx.lineTo(rx2,cy+R-110); ctx.stroke();
    for(const sy of[cy-150,cy,cy+150])for(const sx of[lx,rx2]){
      ctx.beginPath(); ctx.arc(sx,sy,5,0,Math.PI*2); ctx.strokeStyle=rail; ctx.lineWidth=2; ctx.stroke();
    }
    ctx.font='13px '+MONO;
    ctx.fillStyle=rail; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    let gi=0;
    for(let gy=cy-110;gy<cy+120;gy+=42){
      ctx.fillText(gi%2===0?'+':'×',lx-6,gy);
      ctx.fillText(gi%2===0?'·':'+',rx2-4,gy); gi++;
    }
    ctx.fillStyle=rail;
    for(let gy=cy-130;gy<cy+130;gy+=18) ctx.fillRect(rx2+4,gy,3,3);
    const stripe=(px,py,n,ln,gap)=>{ ctx.strokeStyle=rgba(engrave_c,0.24); ctx.lineWidth=2;
      for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(px+i*gap,py);ctx.lineTo(px+i*gap+ln,py+ln);ctx.stroke();}};
    for(const[px,py,n,ln,gap]of[[cx+120,cy-R+60,7,46,9],[cx-R+60,cy+110,6,40,9],[cx+apothem-120,cy+60,5,34,8]])
      if(decoOk(px,py,px+(n-1)*gap+ln,py+ln)[0]) stripe(px,py,n,ln,gap);
    if(tone==='ef_gold_pure'){
      for(const[px,py,ang]of[[cx-R+70,cy-R+130,32]]){
        const a=ang*Math.PI/180, hx=Math.cos(a)*48+5, hy=Math.sin(a)*48+5;
        const oklit=decoOk(px-hx,py-hy,px+hx,py+hy);
        if(!oklit[0])continue;
        // 引擎 `_deco_c` 同口径：落点在受光侧时暗笔 rgb(92,74,34) → engrave 奶白
        const pc=oklit[1]?rgba(engrave_c,1):'rgb(92,74,34)';
        ctx.strokeStyle=pc; ctx.fillStyle=pc; ctx.lineWidth=10; ctx.lineCap='round';
        ctx.beginPath(); ctx.moveTo(px-Math.cos(a)*48,py-Math.sin(a)*48);
        ctx.lineTo(px+Math.cos(a)*48,py+Math.sin(a)*48); ctx.stroke();
        ctx.beginPath(); ctx.arc(px-Math.cos(a)*48,py-Math.sin(a)*48,5,0,Math.PI*2); ctx.fill();
      }
      ctx.lineCap='butt';
      ctx.fillStyle='rgba(250,247,235,'+(200/255)+')';
      for(let r2=0;r2<4;r2++)for(let c2=0;c2<3;c2++){
        ctx.beginPath(); ctx.arc(cx-R+56+c2*16,cy-16+r2*16,4,0,Math.PI*2); ctx.fill();
      }
    }
  }

  // ---- 描边：贴边向内的**实心带**（引擎 band_w 同口径），不是居中细线 ----
  ctx.beginPath();
  for(const rr of [R-LG.edge.inset, R-LG.edge.inset-LG.edge.bandW]){
    const p=hexPts(cx,cy,rr); ctx.moveTo(p[0][0],p[0][1]);
    for(let i=1;i<6;i++) ctx.lineTo(p[i][0],p[i][1]);
    ctx.closePath();
  }
  ctx.fillStyle=rgb(outline_c); ctx.fill('evenodd');
  hexPath(ctx,cx,cy,R-LG.innerRing.inset);
  ctx.strokeStyle=rgba(outline_c,LG.innerRing.alpha); ctx.lineWidth=LG.innerRing.width; ctx.stroke();

  // ---- 顶部铭牌框 v2（车牌式 + 四角铆钉 + 空心三角，story/combat 同款）/ industry：五金件 ----
  if(fam==='industry'){
    efIndustryHardware(ctx,cx,cy,R,outline_c,engrave_c,tp,tone);
  }else{
  const plate_w=168, plate_h=82, top_y=cy-R+58;
  roundedRect(ctx,cx-plate_w/2,top_y,plate_w,plate_h,14);
  // 面板这块区域的电平走实测 `d_ref`（极性判定）：素材判 `flat` ⇒ 与周围金属齐平，只画框不填色
  if(LM.plateLift!=null){
    ctx.fillStyle=rgba(f_mid.map(v=>Math.round(v*(1+LM.plateLift))),LG.plate.fillAlpha);
    ctx.fill();
  }
  ctx.strokeStyle=rgb(outline_c); ctx.lineWidth=6; ctx.stroke();
  for(const sx of[-1,1])for(const sy of[-1,1]){
    ctx.beginPath();
    ctx.arc(cx+sx*(plate_w/2-13),top_y+plate_h/2+sy*(plate_h/2-13),5,0,Math.PI*2);
    ctx.fillStyle=rgb(outline_c); ctx.fill();
  }
  ctx.strokeStyle=rgb(outline_c); ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(cx,cy-R+4); ctx.lineTo(cx-12,cy-R+38); ctx.lineTo(cx+12,cy-R+38);
  ctx.closePath(); ctx.stroke();
  }
  // 角部工程注记：落点 = 素材 corner bin 暗元分位（`engine/ef_layer_geom.py` 的 CORNER 表），
  // 按**注记块中心**对齐 ⇒ 不受网页字体度量影响；引擎侧同一张表反解成左基线锚点。
  // 相对电平喂法：喂**反差** Δ = corner − cornerBase，落笔色 = clip(脚下环带中位 + Δ)；
  // 兜底：未喂色的组吃 `cornerFall`（= 引擎 c_dark×255 三通道同减），
  // 与引擎的兜底支同一条式子 ⇒ 两侧都不再把 `engrave` 绝对色当注记。
  // 两侧差异第 3 条（暂不统一）：环带不足时引擎直接 raise，网页只 console.warn 并退回 corner_c。
  ctx.font=LG.corner.size+'px '+MONO;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const corner_d = (LM.corner && LM.cornerBase) ? LM.corner.map((v,i)=>v-LM.cornerBase[i]) : (LM.cornerFall||null);
  for(const at of LG.corner.at){
    const ax=cx+at[0]*R, ay=cy+at[1]*R;
    const bg = corner_d ? efAnnotLocalBg(ctx,hmx,at[2],ax,ay,LG.corner.size,LG.corner.ring) : null;
    if(corner_d && !bg) console.warn('corner 局部背景环带不足 ⇒ 该条退回绝对色', at[2]);
    ctx.fillStyle=rgba(bg ? efCornerRel(bg,corner_d) : corner_c, LG.corner.alpha);
    ctx.fillText(at[2],ax,ay);
  }
  // ---- 底部接口触点 ----
  const botY=Math.round(cy+apothem)-34;
  for(const dx of[-52,52]){
    ctx.beginPath(); ctx.arc(cx+dx,botY,7,0,Math.PI*2);
    ctx.strokeStyle=rgba(engrave_c,0.78); ctx.lineWidth=3; ctx.stroke();
  }
  roundedRect(ctx,cx-26,botY+12,52,12,6);
  ctx.fillStyle=rgba(engrave_c,0.35); ctx.fill();

  // ---- 章面文字 ----
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  if(tone==='ef_dark'&&number){
    ctx.font='44px '+FONT_EN; ctx.fillStyle=rgba(engrave_c,0.9);
    ctx.fillText('#'+number,cx+R-190,cy-60);
  }else if(number&&fam!=='combat'&&tone==='ef_silver'){
    const nw=138,nh=58,nx=cx-nw/2-46,ny=cy+R-196;
    roundedRect(ctx,nx,ny,nw,nh,9); ctx.fillStyle='rgba(20,22,24,0.843)'; ctx.fill();
    roundedRect(ctx,nx+1,ny+1,nw-2,nh-2,8);
    ctx.strokeStyle='rgba(255,255,255,0.431)'; ctx.lineWidth=2; ctx.stroke();
    ctx.font='38px '+FONT_EN; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgb(245,245,240)'; ctx.fillText(number,nx+nw/2,ny+nh/2+1);
  }else if(number&&fam==='story'&&(tone==='ef_gold_pure'||tone==='ef_gold'||tone==='ef_pearl')){
    ctx.font='64px '+FONT_EN; ctx.fillStyle=rgba(engrave_c,0.88);
    ctx.fillText(number,cx-R+84,cy+70);
  }
  if(fam==='combat'&&number){
    ctx.font='46px '+FONT_EN; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle=rgba(engrave_c,0.86);
    ctx.fillText(number+' TIMES',cx,cy+R-240);
  }
  let note=serial?'EF-MEDAL SYS // '+serial:'EF-MEDAL SYS';
  ctx.font='17px '+MONO; ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  while(ctx.measureText(note).width>210&&note.length>4)note=note.slice(0,-1);
  ctx.fillStyle=tone==='ef_pearl'?'rgba(60,64,68,0.67)':rgba(engrave_c,0.63);
  ctx.fillText(note,cx-ctx.measureText(note).width/2,cy-R+196);

  // ---- 章体厚斜边（N-1）：整幅乘增益图，必须在裁回章体**之前**（与引擎同序）----
  const rimG=efRimGain(tone);
  if(rimG){
    const rimIm=ctx.getImageData(0,0,CW,CH), rp=rimIm.data;
    for(let i=0,n=CW*CH;i<n;i++){
      const k=rimG[i];
      if(k===1) continue;
      const b=i*4;   // 引擎是 float→uint8 截断，这里同样用 trunc 而不是 round
      rp[b]=Math.min(255,Math.trunc(rp[b]*k));
      rp[b+1]=Math.min(255,Math.trunc(rp[b+1]*k));
      rp[b+2]=Math.min(255,Math.trunc(rp[b+2]*k));
    }
    ctx.putImageData(rimIm,0,0);
  }

  // ---- 纯金终段高光去饱和（R-30b，同引擎终段）：官方整章 V0.8+ S=0.39 vs 我方 0.50+；
  // 门控用 V=max 通道（饱和金色 mean 远低于 max），绕 luma 缩放、亮度不变 ----
  if(tone==='ef_gold_pure'){
    const fim=ctx.getImageData(0,0,CW,CH), fp=fim.data;
    for(let i=0,n=CW*CH;i<n;i++){
      const b=i*4, r0=fp[b], g0=fp[b+1], b0=fp[b+2];
      const vmx=Math.max(r0,g0,b0);
      if(vmx<=178) continue;
      const k=Math.max(0.74,Math.min(1,1-(vmx/255-0.70)*1.30));
      if(k===1) continue;
      const lum=(r0+g0+b0)/3;
      fp[b]=Math.min(255,Math.trunc(lum+(r0-lum)*k));
      fp[b+1]=Math.min(255,Math.trunc(lum+(g0-lum)*k));
      fp[b+2]=Math.min(255,Math.trunc(lum+(b0-lum)*k));
    }
    ctx.putImageData(fim,0,0);
  }

  // ---- 裁回章体 + 细颗粒 ----
  const km=document.createElement('canvas'); km.width=CW; km.height=CH;
  const kmx=km.getContext('2d');
  hexPath(kmx,cx,cy,R-3); kmx.fillStyle='#fff'; kmx.fill();   // 三家族轮廓统一正六边形，无外凸件
  cropToMask(canvas,km);
  // 收尾细颗粒 ±2（N-12g 上岗）：与引擎 `compose_endfield` 的 `GRAIN_K` 同值、同种子 7。
  // ±4 时章面静区压在自家噪声地板上（带通尺 e_p05 2.35 vs 官方 0.49–0.60），±2 降到 1.41 且不长条带；
  // 0 = 完全去颗粒会露出硬台阶（N-12c 判负），不许往那个方向改。
  applyGrain(canvas,7,2);
}


/* ---------------- 糖果贴纸章模板 v3（对齐引擎图层顺序） ---------------- */
function composeCandy(canvas, subject, text, number, pattern) {
  const CW=1000, CH=1180, cx=CW/2, cy=570, R=430;
  canvas.width=CW; canvas.height=CH;
  const ctx=canvas.getContext('2d');
  const apothem=R*Math.sqrt(3)/2;
  const gold_hi=[244,205,126], gold_mid=[226,178,96], gold_lo=[182,130,62];
  const pink=[247,168,184], teal=[159,224,200], white=[255,253,250];
  const cream=[255,250,240], wine=[150,58,48];
  const fieldColor=[[249,231,224],[244,216,208]];

  // L0 悬浮投影
  const shLayer=document.createElement('canvas'); shLayer.width=CW; shLayer.height=CH;
  const shl=shLayer.getContext('2d');
  polyPath(shl,hexPts(cx,cy,R+34).map(p=>[p[0]+6,p[1]+14]));
  shl.fillStyle='rgba(140,100,80,0.275)'; shl.fill();
  const shB=document.createElement('canvas'); shB.width=CW; shB.height=CH;
  const shbx=shB.getContext('2d');
  shbx.filter='blur(10px)';
  shbx.drawImage(shLayer,0,0);
  ctx.drawImage(shB,0,0);

  // L1 白胶边
  hexPath(ctx,cx,cy,R+30);
  ctx.fillStyle=rgb(white); ctx.fill();

  // L2 粉彩底场（顶点圆角）
  ctx.save();
  const fmp=hexPts(cx,cy,R-6);
  ctx.beginPath();
  ctx.moveTo(fmp[0][0],fmp[0][1]);
  for(let i=1;i<6;i++)ctx.lineTo(fmp[i][0],fmp[i][1]);
  ctx.closePath();
  for(const[vx,vy]of fmp){ctx.moveTo(vx+12,vy);ctx.arc(vx,vy,12,0,Math.PI*2);}
  ctx.clip();
  const fg=ctx.createLinearGradient(0,0,0,CH);
  fg.addColorStop(0,rgb(fieldColor[0]));
  fg.addColorStop(1,rgb(fieldColor[1]));
  ctx.fillStyle=fg; ctx.fillRect(0,0,CW,CH);
  ctx.restore();

  // L3 底纹
  if(pattern==='radial'){
    ctx.strokeStyle='rgba(191,227,242,0.188)'; ctx.lineWidth=5;
    for(let i=0;i<20;i++){
      const a=i*18*Math.PI/180;
      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.lineTo(cx+(R-170)*Math.cos(a),cy+(R-170)*Math.sin(a));
      ctx.stroke();
    }
  }else{
    const rng=mulberry32(5);
    ctx.fillStyle='rgba(247,168,184,0.431)';
    for(let i=0;i<90;i++){
      const a=rng()*Math.PI*2, rr=40+rng()*(R-150);
      ctx.beginPath();
      ctx.arc(cx+rr*Math.cos(a),cy+rr*Math.sin(a),4,0,Math.PI*2);
      ctx.fill();
    }
  }

  // die-cut 内阴影 + 纸质微纹理
  const es=document.createElement('canvas'); es.width=CW; es.height=CH;
  const esx=es.getContext('2d');
  hexPath(esx,cx,cy,R-9);
  esx.strokeStyle='rgba(150,110,90,0.275)'; esx.lineWidth=6; esx.stroke();
  const esB=document.createElement('canvas'); esB.width=CW; esB.height=CH;
  const esbx=esB.getContext('2d');
  esbx.filter='blur(3px)';
  esbx.drawImage(es,0,0);
  ctx.drawImage(esB,0,0);
  applyGrain(canvas,21,2);

  // L4 三色环 + 浮雕（奶油/金/暗红；PIL 内侧带=[r-wd, r]（径向），canvas 带宽按径向换算：
  // 路径半径 p = r - wd/(2·cos30°)，使环带外沿与 PIL 精确对齐）
  const COS30=Math.sqrt(3)/2;
  const bandP=(r,w)=>r-w/(2*COS30);
  const rings=[[R+6,22,cream],[R-32,15,gold_mid],[R-64,9,wine]];
  for(const[rr,wd,col]of rings){
    const sh=col.map(v=>Math.round(v*0.6));
    hexPath(ctx,cx+3,cy+4,bandP(rr,wd)); ctx.strokeStyle=rgba(sh,0.588); ctx.lineWidth=wd; ctx.stroke();
    hexPath(ctx,cx,cy,bandP(rr,wd));     ctx.strokeStyle=rgb(col);      ctx.lineWidth=wd; ctx.stroke();
  }
  hexPath(ctx,cx-3,cy-3,bandP(R+14,5)); ctx.strokeStyle='rgba(255,255,248,0.667)'; ctx.lineWidth=5; ctx.stroke();
  hexPath(ctx,cx,cy,bandP(R-80,4));     ctx.strokeStyle='rgba(255,244,224,0.784)'; ctx.lineWidth=4; ctx.stroke();

  // L5 缝线（白胶边内 R+24）
  const sPts=hexPts(cx,cy,R+24);
  ctx.strokeStyle='rgba(205,178,138,0.922)'; ctx.lineWidth=5;
  for(let i=0;i<6;i++){
    const p0=sPts[i], p1=sPts[(i+1)%6];
    const seg=Math.hypot(p1[0]-p0[0],p1[1]-p0[1]);
    const n=Math.max(1,Math.round(seg/18));
    for(let k=0;k<n;k+=2){
      ctx.beginPath();
      ctx.moveTo(p0[0]+(p1[0]-p0[0])*k/n,p0[1]+(p1[1]-p0[1])*k/n);
      ctx.lineTo(p0[0]+(p1[0]-p0[0])*(k+0.55)/n,p0[1]+(p1[1]-p0[1])*(k+0.55)/n);
      ctx.stroke();
    }
  }

  // L6 贴纸主体（放大、上移、贴纸投影；气泡上沿净空防穿模）
  const sub=cropToSubjectCanvas(subject,0.02);
  const target=620;
  const fr=target/Math.max(sub.width,sub.height);
  const sw=Math.max(1,Math.round(sub.width*fr)), sh2=Math.max(1,Math.round(sub.height*fr));
  const s2=document.createElement('canvas'); s2.width=sw; s2.height=sh2;
  s2.getContext('2d').drawImage(sub,0,0,sw,sh2);
  const sx=Math.round(cx-sw/2), sy=Math.round(cy-sh2/2-62);
  if(text){
    const cutoffY=Math.round(cy+R-236-14);
    const s2x=s2.getContext('2d');
    const id=s2x.getImageData(0,0,sw,sh2); const d=id.data;
    for(let y=0;y<sh2;y++){
      const gy=y+sy;
      if(gy<cutoffY)continue;
      const fade=Math.max(0,Math.min(1,(cutoffY+12-gy)/12));
      for(let xx=0;xx<sw;xx++)d[(y*sw+xx)*4+3]=Math.round(d[(y*sw+xx)*4+3]*fade);
    }
    s2x.putImageData(id,0,0);
  }
  const shC=document.createElement('canvas'); shC.width=sw+30; shC.height=sh2+30;
  const shx=shC.getContext('2d');
  shx.fillStyle='rgba(200,150,140,0.314)';
  shx.fillRect(0,0,shC.width,shC.height);
  shx.globalCompositeOperation='destination-in';
  shx.drawImage(s2,15,17);
  shx.globalCompositeOperation='source-over';
  const shB2=document.createElement('canvas'); shB2.width=shC.width; shB2.height=shC.height;
  const shbx2=shB2.getContext('2d');
  shbx2.filter='blur(9px)';
  shbx2.drawImage(shC,0,0);
  ctx.drawImage(shB2,sx-15,sy-17);
  ctx.drawImage(s2,sx,sy);

  // L7 名字气泡（圆体 + 字距，完全落在内环之内）
  if(text){
    let label=number?`${text} · ${number}`:text;
    const isEN=[...label].every(c=>c.charCodeAt(0)<128);
    ctx.font=isEN?`30px ${FONT_ROUND_EN}`:`34px ${FONT_ROUND_CN}`;
    const trk=6, bubbleH=74, by=cy+R-236;
    const d_c=(by+bubbleH/2)-cy;
    const hw_at=(R-d_c)/R*apothem;
    const max_bw=Math.floor(2*hw_at-44);
    while(labelW(ctx,label,trk)>max_bw-70&&label.length>2)label=label.slice(0,-1);
    const bw=Math.min(Math.round(labelW(ctx,label,trk)+72),max_bw);
    const nbSh=document.createElement('canvas'); nbSh.width=CW; nbSh.height=CH;
    const nsx=nbSh.getContext('2d');
    roundedRect(nsx,cx-bw/2+3,by+7,bw,bubbleH,30);
    nsx.fillStyle='rgba(160,120,90,0.275)'; nsx.fill();
    const nbB=document.createElement('canvas'); nbB.width=CW; nbB.height=CH;
    const nbx=nbB.getContext('2d');
    nbx.filter='blur(5px)';
    nbx.drawImage(nbSh,0,0);
    ctx.drawImage(nbB,0,0);
    roundedRect(ctx,cx-bw/2,by,bw,bubbleH,30);
    ctx.fillStyle='rgba(255,253,250,0.949)'; ctx.fill();
    roundedRect(ctx,cx-bw/2+2.5,by+2.5,bw-5,bubbleH-5,27.5);
    ctx.strokeStyle=rgb(gold_mid); ctx.lineWidth=5; ctx.stroke();
    roundedRect(ctx,cx-bw/2+6,by+6,bw-12,bubbleH-12,24);
    ctx.strokeStyle=rgba(pink,0.706); ctx.lineWidth=2; ctx.stroke();
    trackedText(ctx,label,cx,by+bubbleH/2,'rgb(90,64,34)',trk,'rgb(150,110,60)');
  }

  // L8 装饰主次组织
  const fx=cx+R*0.50, fy=cy-R*0.50;
  ctx.strokeStyle=rgba(pink,0.980); ctx.lineWidth=9;
  for(let k=0;k<4;k++){
    const ang=(k*90+45)*Math.PI/180;
    ctx.beginPath();
    ctx.moveTo(fx-26*Math.cos(ang),fy-26*Math.sin(ang));
    ctx.lineTo(fx+26*Math.cos(ang),fy+26*Math.sin(ang));
    ctx.stroke();
  }
  ctx.fillStyle=rgba(teal,0.882);
  for(const[tx2,ty2,rr]of[[fx+26,fy+22,9],[fx+42,fy+32,6],[fx+54,fy+39,4]]){
    ctx.beginPath(); ctx.arc(tx2,ty2,rr,0,Math.PI*2); ctx.fill();
  }
  drawHeart(ctx,cx-R*0.52,cy+R*0.40,17,rgba(pink,0.961));
  drawHeart(ctx,cx-R*0.60,cy+R*0.47,12,rgba(gold_hi,0.933));
  drawHeart(ctx,cx-R*0.66,cy+R*0.52,8,rgba(teal,0.882));
  ctx.fillStyle=rgba(gold_hi,0.843);
  for(const[dx2,dy2]of[[0,0],[18,14],[34,26]]){
    ctx.beginPath();
    ctx.arc(cx-R*0.50+dx2-5,cy-R*0.58+dy2-5,5,0,Math.PI*2);
    ctx.fill();
  }

  // L9 收口外环（PIL 内侧带=[R-18,R+6]，径向换算外沿对齐）+ 整图裁回白胶边轮廓
  hexPath(ctx,cx,cy,bandP(R+6,24));
  ctx.strokeStyle=rgb(gold_lo); ctx.lineWidth=24; ctx.stroke();
  const om=document.createElement('canvas'); om.width=CW; om.height=CH;
  const omx=om.getContext('2d');
  hexPath(omx,cx,cy,R+30); omx.fillStyle='#fff'; omx.fill();
  cropToMask(canvas,om);
}

};

/* ---------------- 主流程 ---------------- */
let busy=false;
async function generate(){
  if(busy||!srcImage)return;
  busy=true;$('gen').disabled=true;
  try{
    const base=toCanvas(srcImage);
    let subject;
    if(hasAlphaCanvas(base)){
      subject=base;
      setStatus('检测到透明通道，按设计资产直接入章');
    }else if(!$('no-mat').checked){
      setStatus('AI 抠图中…','',true);
      subject=await aiCut(srcImage);
      if(subject)setStatus('AI 模型抠图完成');
      else{
        setStatus('AI 抠图不可用或未抠到主体，使用内置算法抠图…','',true);
        subject=await classicCut(srcImage);
        if(subject)setStatus('已用内置算法完成抠图','warn');
        else{subject=base;setStatus('自动抠图置信度低，回退整图入章','warn');}
      }
    }else subject=base;
    setStatus('纹章化与章体合成中…','',true);
    await new Promise(r=>setTimeout(r,30));
    const tone=$('tone').value;
    const text=$('t-main').value.trim()||'蚀刻勋章';
    const subtitle=$('t-sub').value.trim();
    const number=$('t-num').value.trim();
    const serial=$('t-ser').value.trim();
    if(style==='candy'){
      composeCandy(stage,subject,text,number,$('pat').value);
    }else{
      const faceTone=style==='endfield'
        ? ({silver:'ef_silver',gold_pure:'ef_gold_pure',gold_plated:'ef_gold',dark:'ef_dark',bronze:'ef_bronze',pearl:'ef_pearl'})[tone]
        : (tone==='stamp'?'silver':tone);
      // 路由与引擎 `generate()` 同一条：`style=="endfield" && mode=="auto"` ⇒ silhouette
      // （badge_engine.py:2780-2781），其余档（方舟/candy/`SILO_ROUTE=0`）仍走 line 主干。
      const silo=style==='endfield'&&SILO_ROUTE===1;
      const dualOn=silo&&DUALITY_K>0.0&&(DUALITY_GUARD[faceTone]!=null);
      // 第一趟**强制关支**：引擎的 `first_k` 在默认档下恒 0（判病要拿默认臂成图去量）。
      let face=silo?etchSilhouette(subject,faceTone,+$('r-ls').value,+$('r-dt').value,690,0.0).face
                   :etchFace(subject,faceTone,+$('r-ls').value,+$('r-dt').value,690);
      if(style==='endfield'){
        const fam=($('fam')||{value:'story'}).value;
        const lsV=+$('r-ls').value, dtV=+$('r-dt').value;
        composeEndfield(stage,face,number,serial,tone,fam);
        if(dualOn){
          const r=dualGate(faceTone,face,
            k=>etchSilhouette(subject,faceTone,lsV,dtV,690,k).face,
            f=>composeEndfield(stage,f,number,serial,tone,fam));
          face=r.face; window.__dualmsg=r.msg;
        } else window.__dualmsg='gate=off silo='+(silo?1:0);
      }else{
        composeArknights(stage,face,text,subtitle,serial,number,tone);
        if(tone==='plated')applyAkPlating(stage);
      }
    }
    $('placeholder').style.display='none';
    stage.toBlob(b=>{outBlob=b;},'image/png');
    setStatus('完成 ✔ 全程本地处理');
  }catch(err){
    window.__lastStack=(err&&err.stack)||String(err);setStatus('生成失败：'+err.message,'err');console.error(err);
  }finally{busy=false;$('gen').disabled=false;}
}
$('gen').onclick=generate;
$('dl').onclick=()=>{
  if(!outBlob){setStatus('请先生成蚀刻章','warn');return;}
  const a=document.createElement('a');
  const u=URL.createObjectURL(outBlob);
  a.href=u;
  a.download=`arknights_medal_designer_${style}_${Date.now()}.png`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
};
setStatus('等待上传照片…');
/* 数值对比钩子：只读地调用**出厂那份** `silhouetteFace`，输入走 /file、输出走 /put。
   钩子本身不做任何电平算术 —— 它只搬运字节，链条全部走产线路径；segs 由 Python 侧点名，
   免把九张 660×660 的场全搬回去（只搬这一档用得上那些）。
   `consts` 只列**页内真的有声明**的那六条：`LA_SILO` / `SILO_POLAR_K` 属「不镜像清单」
   （引擎判负不接线 ⇒ 页侧根本没有这两个标识符），在这里引用它们会让本句在求值时抛
   ReferenceError、把整个模块的最后一行打断（`node --check` 只查语法、查不出未绑定名）。
   引擎那两条默认关死的档由 `ln5_parity.py` 的 ENGINE_LIVE 在 Python 侧钉，不靠页面回报。 */
window.__ln5 = {
  silhouetteFace:silhouetteFace, etchSilhouette:etchSilhouette, blockReads:blockReads,
  consts:{SILO_ROUTE:SILO_ROUTE, DUALITY_K:DUALITY_K, FACE_INK:FACE_INK,
          EMBLEM_HOLD:EMBLEM_HOLD, LINESTOP:LINESTOP, EDGE_GATE:EDGE_GATE},
  face:async function(tag,src,w,h,tone,ls,dt,k,segs){
    const buf=new Uint8ClampedArray(await (await fetch('/file/sub_'+src+'.bin')).arrayBuffer());
    if(buf.length!==w*h*4) throw new Error('sub_'+src+'.bin 长度 '+buf.length+' ≠ '+w*h*4);
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const cc=c.getContext('2d');
    cc.putImageData(new ImageData(buf,w,h),0,0);
    const r=silhouetteFace(c,tone,ls,dt,k);
    const fw=r.face.width, fh=r.face.height;
    // subE 只在点名时才回传：画布往返与页侧常量无关，同一 src 的多个臂共用一份 owner 的字节，
    // 43 个 tag 各存一份 660×660 RGBA 会把留档盘撑到 70MB 以上而读数一模一样。
    const srcs={subE:null,t:r.t,g8:r.dbg.g8,av:r.dbg.av,ga:r.dbg.ga,solid:r.dbg.solid,
                edgeU:r.dbg.edgeU,cont:r.dbg.cont,field:r.dbg.field,inner:r.dbg.inner};
    for(const sg of segs){
      let body;
      if(sg==='face'){
        body=new Uint8Array(r.face.getContext('2d').getImageData(0,0,fw,fh).data.buffer.slice(0));
      }else if(sg==='subE'){
        body=new Uint8Array(cc.getImageData(0,0,w,h).data.buffer.slice(0));
      }else{
        const a=srcs[sg];
        if(!a) throw new Error('无此段 '+sg);
        body=new Uint8Array((a instanceof Float32Array?a:new Float32Array(a)).buffer);
      }
      await fetch('/put?name='+sg+'_'+tag+'.bin',{method:'POST',body:body});
    }
    return {tag:tag,src:src,fw:fw,fh:fh,amin:r.amin,bgT:r.dbg.bgT,
            consts:{SILO_ROUTE:SILO_ROUTE,DUALITY_K:DUALITY_K,FACE_INK:FACE_INK,
                    EMBLEM_HOLD:EMBLEM_HOLD,LINESTOP:LINESTOP,EDGE_GATE:EDGE_GATE}};
  },
  blur:async function(tag,w,h,sigma){
    const u=new Uint8Array(await (await fetch('/file/fld_'+tag+'.u8.bin')).arrayBuffer());
    if(u.length!==w*h) throw new Error('fld_'+tag+' 长度 '+u.length+' ≠ '+w*h);
    const g=new Float32Array(w*h);
    for(let i=0;i<w*h;i++) g[i]=u[i]/255;
    const b=blurLuma(g,w,h,sigma);
    await fetch('/put?name=blur_'+tag+'.bin',{method:'POST',body:new Uint8Array(b.buffer)});
    return {tag:tag,n:b.length};
  },
  /* WD-2e 接力档：输入不是照片而是**引擎自己那份** `sm`（分带前那张平滑场）与掩膜，
     页侧只走 `dualityMap`+`posterizeField` 两段纯算术 ⇒ 两台高斯仪器（PIL 与画布）全部出局，
     与引擎 `cont`/`field` 的差值只能来自链条本身。这一档不参与生产，只搬字节。 */
  relay:async function(tag,w,h,tone,k){
    const n=w*h;
    const sm=new Float32Array(await (await fetch('/file/pin_'+tag+'.bin')).arrayBuffer());
    const msk=new Uint8Array(await (await fetch('/file/msk_'+tag+'.bin')).arrayBuffer());
    if(sm.length!==n||msk.length!==n)
      throw new Error('pin/msk 长度 '+sm.length+'/'+msk.length+' ≠ '+n);
    const cont=dualityMap(sm,w,h,tone,msk,k);
    const field=posterizeField(cont,n);
    for(const sg of ['cont','field']){
      const a=(sg==='cont'?cont:field);
      const body=new Uint8Array((a instanceof Float32Array?a:new Float32Array(a)).buffer);
      await fetch('/put?name='+sg+'_'+tag+'.bin',{method:'POST',body:body});
    }
    const lv=new Set(); for(let i=0;i<n;i++) lv.add(Math.round(field[i]*1e6)/1e6);
    return {tag:tag,n:n,levels:lv.size,k:k,tone:tone};
  },
  servedSha: async function(){
    try{ return (await (await fetch('/ping')).text()).trim(); }catch(e){ return 'ping失败:'+e; }
  },
  runAll:async function(spec){
    const served=await this.servedSha();          // 这一趟到底端的是哪一份 html，现场留证
    const rows=[];
    for(const it of spec.items){
      let row;
      try{ row=await this.face(it.tag,it.src,it.w,it.h,it.tone,it.ls,it.dt,it.k,it.segs); row.ok=1; }
      catch(e){ row={tag:it.tag,ok:0,err:String((e&&e.message)||e)}; }
      rows.push(row);
    }
    const st={variant:spec.variant,served:served,rows:rows};
    await fetch('/state',{method:'POST',body:JSON.stringify(st,null,1)});
    return st;
  },
  runBlurAll:async function(spec){
    const served=await this.servedSha();
    const rows=[];
    for(const it of spec.items){
      let row;
      try{ row=await this.blur(it.tag,it.w,it.h,it.sigma); row.ok=1; }
      catch(e){ row={tag:it.tag,ok:0,err:String((e&&e.message)||e)}; }
      rows.push(row);
    }
    const st={variant:spec.variant,served:served,rows:rows};
    await fetch('/state',{method:'POST',body:JSON.stringify(st,null,1)});
    return st;
  },
  runRelayAll:async function(spec){
    const served=await this.servedSha();
    const rows=[];
    for(const it of spec.items){
      let row;
      try{ row=await this.relay(it.tag,it.w,it.h,it.tone,it.k); row.ok=1; }
      catch(e){ row={tag:it.tag,ok:0,err:String((e&&e.message)||e)}; }
      rows.push(row);
    }
    const st={variant:spec.variant,served:served,rows:rows};
    await fetch('/state',{method:'POST',body:JSON.stringify(st,null,1)});
    return st;
  }
};
</script>
